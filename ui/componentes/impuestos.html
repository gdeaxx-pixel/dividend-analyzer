<!-- Escrito y mantenido A MANO. Esta vista (categoría «Impuestos») nunca existió en el
     demo del artifact, así que NO hay un `tools/extract_impuestos.py` y no se genera de
     ninguna fuente. Se cablea a datos reales por {{DATA_JSON}} (armado en
     `ui/adapters.py::impuestos_data`, que solo lee objetos fiscales ya calculados por
     `logic.py` — Regla 3 de `specs/roc-nra-invariants.md`).
     Lo que SÍ se sigue generando del demo es la taxonomía y los tokens, con
     `tools/extract_design_system.py`; ese contrato está vivo y su `--check` pasa. El
     bloque de auto-alto del final es el de `tools/_auto_alto.py`, igual que los demás
     componentes. -->
<meta charset="utf-8">
<style>
  :root {
    --font-mono: "JetBrains Mono", "Fira Code", "Space Mono", ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    --ground:      #f4f7fa;
    --panel:       #ffffff;
    --panel-tint:  #eef4f9;
    --ink:         #021C36;
    --ink-2:       #33475a;
    --ink-mut:     #6a7b8a;
    --hair:        #d5e0ea;
    --hair-soft:   #e6edf3;
    --accent:      #006497;
    --accent-tint: rgba(0,100,151,0.10);
    --cash:        #1f8a5b;
    --loss:        #A32D2D;
    --warn:        #a06a1a;
    --coral:       #c0522d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0b1420; --panel:#101d2b; --panel-tint:#142639; --ink:#eaf1f7; --ink-2:#c3d1de;
      --ink-mut:#8598a9; --hair:#26394c; --hair-soft:#1c2c3c; --accent:#3ea0d6;
      --accent-tint:rgba(62,160,214,0.14); --cash:#35b07d; --loss:#e07a7a; --warn:#d9a441;
      --coral:#e0885f;
    }
  }
  :root[data-theme="light"] {
    --ground:#f4f7fa; --panel:#ffffff; --panel-tint:#eef4f9; --ink:#021C36; --ink-2:#33475a;
    --ink-mut:#6a7b8a; --hair:#d5e0ea; --hair-soft:#e6edf3; --accent:#006497;
    --accent-tint:rgba(0,100,151,0.10); --cash:#1f8a5b; --loss:#A32D2D; --warn:#a06a1a;
    --coral:#c0522d;
  }
  :root[data-theme="dark"] {
    --ground:#0b1420; --panel:#101d2b; --panel-tint:#142639; --ink:#eaf1f7; --ink-2:#c3d1de;
    --ink-mut:#8598a9; --hair:#26394c; --hair-soft:#1c2c3c; --accent:#3ea0d6;
    --accent-tint:rgba(62,160,214,0.14); --cash:#35b07d; --loss:#e07a7a; --warn:#d9a441;
    --coral:#e0885f;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--font-sans); -webkit-font-smoothing: antialiased; line-height: 1.5;
  }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

  .wrap { max-width: 940px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px) 64px; }

  .imp-head { padding-bottom: 12px; border-bottom: 1px solid var(--hair); margin-bottom: 18px; }
  .imp-title { font-family: var(--font-mono); font-size: clamp(18px, 2.8vw, 24px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; margin: 0; }
  .imp-lede { font-size: 13.5px; color: var(--ink-2); margin: 8px 0 0; max-width: 70ch; line-height: 1.5; }
  .imp-lede b { color: var(--ink); font-weight: 600; }

  /* escalera vertical — un peldaño por fila, nada se mueve, se lee de arriba a abajo */
  .imp-escalera { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
  .imp-step {
    padding: 14px 18px; background: var(--panel); border: 1px solid var(--hair);
    border-left: 3px solid var(--hair-soft);
  }
  .imp-step.activo { border-left-color: var(--accent); }
  .imp-step.pendiente { border-left-color: var(--hair); opacity: .7; }
  .imp-step-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px 18px; flex-wrap: wrap; }
  .imp-step-q { font-size: 13.5px; color: var(--ink); font-weight: 600; }
  .imp-step-n { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mut); }
  .imp-step-val { text-align: right; }
  .imp-step-money { font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--ink); }
  .imp-step-pct { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--ink-mut); margin-left: 8px; }
  .imp-step-sub { font-size: 11.5px; color: var(--ink-mut); margin: 6px 0 0; line-height: 1.5; }
  .imp-step-sub b { color: var(--ink-2); }
  .imp-step-body { min-height: 20px; }

  /* CTA de residencia (peldaño 3 sin país) — reserva su espacio para que declarar el
     país no empuje nada de abajo */
  .imp-cta { margin-top: 8px; padding: 12px 14px; background: var(--panel-tint); border-left: 3px solid var(--warn); font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
  .imp-cta b { color: var(--ink); }

  /* tres buckets de la retención — tres colores porque los remedios son tres */
  .imp-buckets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  /* peldaño 5: dos cajas, no tres. Va como clase y NO como `style` inline — un inline gana
     a la media query de abajo y dejaba dos columnas de ~110px en móvil (medido a 375px). */
  .imp-buckets.dos { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 560px) {
    .imp-buckets, .imp-buckets.dos { grid-template-columns: 1fr; }
  }
  .imp-bucket { padding: 11px 13px; background: var(--panel-tint); border-top: 3px solid var(--hair); }
  .imp-bucket.gris { border-top-color: var(--ink-mut); }
  .imp-bucket.ambar { border-top-color: var(--warn); }
  .imp-bucket.coral { border-top-color: var(--coral); }
  .imp-bucket-lab { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-mut); margin: 0 0 6px; }
  .imp-bucket-money { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--ink); }
  .imp-bucket-pct { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mut); }
  .imp-bucket.gris .imp-bucket-lab { color: var(--ink-2); }
  .imp-bucket.ambar .imp-bucket-lab { color: var(--warn); }
  .imp-bucket.coral .imp-bucket-lab { color: var(--coral); }
  .imp-bucket-note { font-size: 10.5px; color: var(--ink-mut); margin: 6px 0 0; line-height: 1.45; }
  /* Base fiscal tras el ROC. Panel propio y NO una tercera caja de `.imp-buckets`: las cajas
     de ahí son cifras hermanas que conviven; ésta es la MISMA cifra en otro momento, y
     ponerla al lado invitaría justo a la resta que la Regla 2 del contrato prohíbe. */
  .imp-fiscal { margin-top: 12px; padding: 12px 14px; background: var(--panel-tint); border-left: 3px solid var(--ink-mut); }
  .imp-fiscal-lab { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 6px; }
  .imp-fiscal-par { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; margin: 10px 0 0; font-size: 11.5px; color: var(--ink-mut); }
  .imp-fiscal-par b { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--ink); }
  .imp-fiscal-flecha { font-family: var(--font-mono); color: var(--ink-mut); }

  .imp-conc { margin-top: 12px; padding: 12px 14px; background: var(--panel-tint); border-left: 3px solid var(--accent); font-size: 12.5px; color: var(--ink); line-height: 1.55; }
  .imp-conc b { font-family: var(--font-mono); }

  /* tabla por fondo — el desglose va DENTRO del componente, no en la ruta */
  .imp-block { margin-top: 30px; }
  .imp-scroll { overflow-x: auto; padding-bottom: 2px; }
  .imp-tbl { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 12px; }
  .imp-tbl th, .imp-tbl td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--hair-soft); white-space: nowrap; }
  .imp-tbl th { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-mut); font-weight: 700; border-bottom: 2px solid var(--ink); }
  .imp-tbl th:first-child, .imp-tbl td:first-child { text-align: left; }
  .imp-tbl td { font-family: var(--font-mono); color: var(--ink); }
  .imp-tbl td.tk { font-family: var(--font-sans); font-weight: 800; }
  .imp-tbl td.mut { color: var(--ink-mut); font-weight: 400; }
  .imp-tbl tr.total td { border-bottom: none; border-top: 2px solid var(--ink); font-weight: 700; }
  .imp-tbl .c-ambar { color: var(--warn); }
  .imp-tbl .c-coral { color: var(--coral); }

  /* Ruta A / Ruta B — cómo recuperar lo que sí vuelve */
  .imp-rutas { margin-top: 30px; display: flex; flex-direction: column; gap: 14px; }
  .imp-ruta { padding: 14px 16px; background: var(--panel); border: 1px solid var(--hair); border-left: 3px solid var(--accent); }
  .imp-ruta-h { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.03em; color: var(--accent); margin: 0 0 8px; }
  .imp-ruta-p { font-size: 12.5px; color: var(--ink-2); line-height: 1.6; margin: 0 0 8px; }
  .imp-ruta-p:last-child { margin-bottom: 0; }
  .imp-ruta-p b { color: var(--ink); font-weight: 600; }
  .imp-ruta-est { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--warn); }
  .imp-ruta ol { margin: 6px 0 0; padding-left: 20px; font-size: 12.5px; color: var(--ink-2); line-height: 1.65; }
  .imp-ruta ol li { margin: 0 0 5px; }
  .imp-ruta ol li b { color: var(--ink); }

  .imp-foot { margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--hair); font-size: 11px; color: var(--ink-mut); line-height: 1.6; }
</style>
<main class="wrap">
  <header class="imp-head">
    <h2 class="imp-title" id="impTitle">La escalera de tus impuestos</h2>
    <p class="imp-lede" id="impLede"></p>
  </header>

  <div class="imp-escalera" id="impEscalera"></div>

  <section class="imp-block" id="impBlock">
    <div class="imp-scroll">
      <table class="imp-tbl" id="impTabla"></table>
    </div>
  </section>

  <section class="imp-rutas" id="impRutas"></section>

  <p class="imp-foot" id="impFoot"></p>
</main>
<script>
(function initImpuestos() {
  "use strict";
  var D = {{DATA_JSON}};
  // PR 1 «la mudanza»: la vista se parte en 5 pantallas (`ui/impuestos.VIEW_ORDER`).
  // El contenido no cambia — cada rama construye SOLO su trozo y las secciones que no
  // toca se quitan del DOM, para que el auto-alto mida `body.scrollHeight` real.
  var VISTA_ACTIVA = "{{VISTA_ACTIVA}}";
  var VISTAS_ESCALERA = { corte: 1, venta: 1, pais: 1 };

  function money(x) {
    var n = (x == null || isNaN(x)) ? 0 : Number(x);
    return (n < 0 ? "−$" : "$") + Math.abs(n).toFixed(2);
  }
  function pct(p) {
    if (p == null || isNaN(p)) return "";
    return p.toFixed(1) + "% del bruto";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
  function set(id, html) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }

  var P = D.peldanos || {};
  var tasaTxt = D.declarado ? (D.tasa_pct + "% " + (D.tiene_tratado ? "por el tratado con EE.UU." : "sin tratado")) : null;

  // La SEGUNDA vía para declarar el país. Hasta ahora los CTA solo nombraban el Paso 2 y
  // callaban que el 1042-S ya trae la residencia en la casilla 13b: el cliente que subió el
  // formulario tiene el dato delante y no lo sabe. Tres estados, porque prometer un atajo que
  // no existe es peor que no ofrecerlo:
  //   - hay código y lo sabemos traducir -> es un clic en el Paso 2
  //   - hay código y NO está en la tabla -> hay que elegirlo a mano, se dice
  //   - no hay 1042-S                    -> subirlo es la alternativa
  // El país nunca se deduce de la tasa retenida (30% -> 5 países o W-8BEN ausente): eso lo
  // decide `logic.pais_desde_codigo_1042s` sobre la casilla 13b, en el adapter.
  var R1042 = D.residencia_1042s || {};
  function viaPais() {
    if (R1042.pais_detectado) {
      // Sin repetir «Paso 2»: los tres sitios que llaman a viaPais() ya lo nombran justo
      // antes, y decirlo dos veces en una frase se lee como un error.
      return " Ya lo sabemos por tu 1042-S, que declara <b>" + esc(R1042.pais_detectado)
           + "</b> (casilla 13b): basta con que lo confirmes.";
    }
    if (R1042.codigo) {
      return " Tu 1042-S trae el código <b>" + esc(R1042.codigo) + "</b> (casilla 13b), que no "
           + "está en nuestra tabla de tasas: elígelo a mano.";
    }
    return " Si tienes tu <b>1042-S</b>, subirlo también sirve: la casilla 13b trae tu residencia.";
  }

  // ---- Título + lede por vista (PR 1.1) ----------------------------------------------
  // El breadcrumb ya nombra la vista; el h2 lleva la AFIRMACIÓN, no la etiqueta. `corte`
  // conserva su lede condicional; `venta` y `pais` reciben la 1ª frase de su propio
  // cuerpo, subida aquí y borrada de abajo (misma palabra, un solo sitio); `fondos` y
  // `recuperar` no llevan lede — se quita el `<p>` vacío para no dejar alto muerto.
  (function () {
    var _lede = document.getElementById("impLede");
    if (VISTA_ACTIVA === "corte") {
      set("impTitle", "La escalera de tus impuestos");
      set("impLede",
        D.declarado
          ? "Vives en <b>" + esc(D.pais) + "</b>: te corresponde una retención del <b>" + esc(tasaTxt) + "</b>. "
            + "Esta escalera parte del dividendo bruto que declararon tus fondos y baja hasta lo que de verdad te retuvieron."
          : "Declara tu residencia fiscal en el <b>Paso 2</b> para completar la escalera. "
            + "Sin país no publicamos el peldaño de «lo que te corresponde pagar»: la cifra dependería por entero del supuesto."
            + viaPais());
    } else if (VISTA_ACTIVA === "fondos") {
      set("impTitle", "De dónde salió cada dólar de retención");
      if (_lede) _lede.remove();
    } else if (VISTA_ACTIVA === "venta") {
      set("impTitle", "Vender no es cobrar un dividendo");
      set("impLede", "Para un no residente, la ganancia de capital de un ETF o una acción "
        + "normal <b>no es renta de fuente estadounidense</b>: EE.UU. no te retiene nada al vender.");
    } else if (VISTA_ACTIVA === "pais") {
      set("impTitle", "La base y el crédito");
      set("impLede", "Esta renta es de <b>fuente extranjera</b> para tu país, así que "
        + "normalmente se declara allí aunque EE.UU. ya te haya retenido. Lo que sigue es "
        + "<b>la base</b> y <b>el crédito</b>: las dos cifras que tu declaración necesita.");
    } else if (VISTA_ACTIVA === "recuperar") {
      set("impTitle", "Lo que vuelve solo y lo que hay que reclamar");
      if (_lede) _lede.remove();
    }
  })();

  // ---- peldaños ----
  function stepRow(n, q, val, pctVal, sub, cls) {
    var right = val == null
      ? '<span class="imp-step-money" style="color:var(--ink-mut)">—</span>'
      : '<span class="imp-step-money">' + money(val) + '</span>'
        + (pctVal == null ? '' : '<span class="imp-step-pct">' + esc(pct(pctVal)) + '</span>');
    return '<div class="imp-step ' + (cls || 'activo') + '">'
      + '<div class="imp-step-top">'
      + '<div><span class="imp-step-n">' + esc(n) + '</span><br><span class="imp-step-q">' + esc(q) + '</span></div>'
      + '<div class="imp-step-val">' + right + '</div>'
      + '</div>'
      + '<div class="imp-step-body">' + (sub || '') + '</div>'
      + '</div>';
  }

  var rocEfectivo = null;
  if (P.bruto && P.bruto.monto > 0 && P.gravable) {
    rocEfectivo = (1 - P.gravable.monto / P.bruto.monto) * 100;
  }

  var pasos = [];

  if (VISTA_ACTIVA === "corte") {
  pasos.push(stepRow("Peldaño 1", "¿Cuánto te repartió el fondo?",
    P.bruto ? P.bruto.monto : 0, P.bruto ? P.bruto.pct : null,
    '<p class="imp-step-sub">El dividendo <b>bruto</b> declarado por tus fondos, antes de cualquier retención. Leído del CSV de tu bróker — no reconstruido sumando hacia atrás.</p>',
    "activo"));

  var gCob = P.gravable || {};
  var sinRoc = gCob.sin_roc || [];
  var cobertura = sinRoc.length
    ? ' El cálculo cubre <b>' + gCob.cubiertos + ' de ' + gCob.total + '</b> '
        + (gCob.total === 1 ? 'fondo' : 'fondos') + '; '
        + (sinRoc.length === 1
            ? 'el fondo <b>' + esc(sinRoc[0]) + '</b> figura sin dato de ROC y tributa'
            : 'los fondos <b>' + sinRoc.map(esc).join(', ') + '</b> figuran sin dato de ROC y tributan')
        + ' sobre el bruto completo.'
    : '';

  pasos.push(stepRow("Peldaño 2", "¿Cuánto era renta de verdad?",
    P.gravable ? P.gravable.monto : 0, P.gravable ? P.gravable.pct : null,
    '<p class="imp-step-sub">Gravable = bruto × (1 − ROC). El <b>Retorno de Capital</b> (ROC) no es renta: es tu propio dinero de vuelta, y no paga impuesto hoy'
      + (rocEfectivo != null && rocEfectivo > 0.5
          ? '. En tu cartera el ROC fue <b>' + rocEfectivo.toFixed(0) + '%</b> del reparto (ver «Fondo por fondo»)'
          : '')
      + '.' + cobertura + '</p>',
    "activo"));

  if (D.declarado && P.corresponde) {
    pasos.push(stepRow("Peldaño 3", "¿Cuánto te corresponde pagar?",
      P.corresponde.monto, P.corresponde.pct,
      '<p class="imp-step-sub">Tu tasa de residencia (<b>' + esc(D.tasa_pct + '%') + '</b>) aplicada sobre la parte gravable. Es lo que un bróker debería retenerte si tu W-8BEN está al día.</p>',
      "activo"));
  } else {
    pasos.push(stepRow("Peldaño 3", "¿Cuánto te corresponde pagar?",
      null, null,
      '<div class="imp-cta">Sin residencia declarada no publicamos esta cifra. Con tasa 0% la app diría «te vuelven todos tus impuestos» — la lectura más optimista posible, y falsa para cualquier residente LATAM sin tratado. <b>Declara tu país en el Paso 2.</b>' + viaPais() + '</div>',
      "activo"));
  }

  // Peldaño 4 — retenido AL COBRO. Tres estados: 'sin_pais' (CTA), 'parcial' (aviso: hay
  // fondos cuyo desglose no es fiable), 'ok' (los tres buckets suman el monto).
  var R = P.retenido || {};
  var buckets = '';
  if (R.estado === "ok") {
    buckets = '<div class="imp-buckets">'
      + '<div class="imp-bucket gris"><p class="imp-bucket-lab">Retención correcta</p>'
        + '<span class="imp-bucket-money">' + money(R.correcta.monto) + '</span> '
        + '<span class="imp-bucket-pct">' + esc(pct(R.correcta.pct)) + '</span>'
        + '<p class="imp-bucket-note">Permanente. No se recupera.</p></div>'
      + '<div class="imp-bucket ambar"><p class="imp-bucket-lab">Exceso por ROC</p>'
        + '<span class="imp-bucket-money">' + money(R.recuperable_roc.monto) + '</span> '
        + '<span class="imp-bucket-pct">' + esc(pct(R.recuperable_roc.pct)) + '</span>'
        + '<p class="imp-bucket-note">Puede volver solo en el cierre anual del bróker (IB ene–mar, Schwab jun–sep).</p></div>'
      + '<div class="imp-bucket coral"><p class="imp-bucket-lab">Gap de tratado / W-8BEN</p>'
        + '<span class="imp-bucket-money">' + money(R.gap_w8ben.monto) + '</span> '
        + '<span class="imp-bucket-pct">' + esc(pct(R.gap_w8ben.pct)) + '</span>'
        + '<p class="imp-bucket-note">Nunca vuelve solo. Se repite cada año hasta renovar el formulario.</p></div>'
      + '</div>';
  } else if (R.estado === "parcial") {
    var sin = (R.fondos_sin_desglose || []).join(", ");
    buckets = '<div class="imp-cta">No podemos separar tu retención en tres con seguridad: en '
      + '<b>' + esc(sin) + '</b> el CSV de tu bróker mezcla los reversos del split inverso de dic-2025 con las filas de impuesto, '
      + 'y la retención «al cobro» de esos fondos no es una cifra fiable. Mostramos lo retenido neto por fondo en la tabla, sin el desglose.</div>';
  } else {
    buckets = '<div class="imp-cta">Declara tu país para separar lo retenido en lo que es permanente, lo que vuelve solo por ROC y el gap de tratado. Son tres cifras con tres remedios distintos — sumarlas en una sola es el error que este diseño evita.' + viaPais() + '</div>';
  }

  // Reembolso YA acreditado — movimiento aparte, NO entra en la descomposición de los tres
  // buckets (carril distinto de la Regla 4). Dato crudo del CSV, se muestra tal cual.
  var yaDev = R.ya_devuelto || {monto: 0};
  var devLine = '<div class="imp-conc" style="border-left-color:var(--cash)">'
    + 'De esa retención al cobro, el bróker <b>ya te devolvió</b> ' + money(yaDev.monto)
    + (yaDev.pct != null ? ' (' + yaDev.pct.toFixed(1) + '% del bruto)' : '')
    + ' en la reclasificación anual del ROC — es un movimiento aparte, no una de las tres porciones.</div>';

  // Impuesto EXTRANJERO (`Foreign Tax Paid`, p. ej. ZIM/Israel) — línea aparte, NUNCA un
  // cuarto bucket: los tres buckets son la partición de la retención NRA de EE.UU. Esto es
  // otro impuesto, de otra jurisdicción, con otro remedio.
  var ftp = R.impuesto_extranjero;
  var ftpLine = '';
  if (ftp && ftp.monto > 0.01) {
    ftpLine = '<div class="imp-conc" style="border-left-color:var(--ink-mut)">'
      + 'Además pagaste ' + money(ftp.monto) + ' de impuesto retenido por <b>emisores de otros '
      + 'países</b> (p. ej. ZIM, Israel). No es retención de EE.UU. y no se reclama con el '
      + '1040-NR: suele ser <b>crédito fiscal</b> en tu país de residencia.</div>';
  }

  var conc = '';
  if (D.concentracion && D.concentracion.otro_ticker) {
    var C = D.concentracion;
    conc = '<div class="imp-conc"><b>' + C.pct.toFixed(1) + '%</b> de tu retención salió de un solo fondo: '
      + '<b>' + esc(C.ticker) + '</b> ' + money(C.retenido) + ' frente a <b>' + esc(C.otro_ticker) + '</b> ' + money(C.otro_retenido)
      + '. La retención NRA se concentra donde se concentra el rendimiento.</div>';
  }

  pasos.push(stepRow("Peldaño 4", "¿Cuánto te retuvieron al cobro?",
    R.monto == null ? 0 : R.monto, R.pct,
    '<p class="imp-step-sub">Lo que el bróker descontó <b>al momento del cobro</b> del dividendo, según tu CSV.'
      + (R.estado === "ok" ? ' No se suma en una cifra: se parte en tres, y los tres suman este monto.' : '') + '</p>'
      + (yaDev.monto > 0.01 ? devLine : '') + buckets + ftpLine + conc,
    "activo"));
  }

  if (VISTA_ACTIVA === "venta") {
  // ---- Peldaño 5: ganancias de capital (Fase 3) ----
  // Mismo fondo que el peldaño 4, resultado OPUESTO: aquí EE.UU. no retiene nada. Por eso
  // la cifra grande del peldaño es $0 y las ganancias van en el cuerpo — el peldaño responde
  // «¿cuánto te retienen?», no «¿cuánto ganaste?».
  var G = D.ganancias_capital;
  if (!G) {
    pasos.push(stepRow("Próximamente", "Ganancias de capital cuando vendas", null, null,
      '<p class="imp-step-sub">Cuando vendas, lo que pagues depende de tu base de costo — y el '
      + 'ROC que te devolvieron la baja. <b>Pendiente</b> — no hay ninguna posición medible en '
      + 'este CSV.</p>',
      "pendiente"));
  } else {
    // La 1ª frase («no es renta de fuente estadounidense…») subió al lede de esta vista;
    // la cola («Mismo fondo que el peldaño de arriba…») se fue con la mudanza — el
    // peldaño 4 vive en «El corte».
    var gBody = '';

    // Las dos ganancias van como cajas hermanas, NO sumadas: son momentos distintos (al
    // cierre de la venta vs. a precio de hoy). Reusa `.imp-bucket` — misma rejilla que el
    // peldaño 4, que es justo la lectura que se busca: cifras que conviven sin sumarse.
    var gCajas = '';
    if (G.no_realizado) {
      gCajas += '<div class="imp-bucket gris"><p class="imp-bucket-lab">Latente · aún no vendes</p>'
        + '<span class="imp-bucket-money">' + money(G.no_realizado.monto) + '</span>'
        + '<p class="imp-bucket-note">Valor hoy ' + money(G.no_realizado.valor_mercado)
        + ' &minus; base de costo ' + money(G.no_realizado.base)
        + '. Se mueve con el mercado todos los días.</p></div>';
    }
    if (G.realizado) {
      gCajas += '<div class="imp-bucket gris"><p class="imp-bucket-lab">Ya realizada · '
        + G.realizado.n_ventas + (G.realizado.n_ventas === 1 ? ' venta' : ' ventas')
        + '</p><span class="imp-bucket-money">' + money(G.realizado.monto) + '</span>'
        + '<p class="imp-bucket-note">Cerrada al precio al que vendiste. Ya no cambia.</p></div>';
    }
    var gFaltan = (G.tickers_indeterminados || []).length;
    var gCaptura = G.tickers_base_captura || [];
    // Las dos cajas ya NO comparten alcance: los fondos cuya base sale de la captura del
    // bróker aportan a la latente y a nada más, así que la realizada cubre menos. Un solo
    // número para las dos sobre-declararía la realizada.
    var gNLat = (G.no_realizado && G.no_realizado.n_fondos) || 0;
    var gNReal = (G.realizado && G.realizado.n_fondos) || 0;

    if (gCajas) {
      // Un total PARCIAL no puede presentarse como el de la cartera: se declara el alcance
      // ANTES de las cifras, no en una nota debajo. Y cuando los dos alcances difieren, cada
      // cifra declara el suyo — que es el caso en cuanto hay una base de captura.
      if (gFaltan || (G.realizado && gNReal !== gNLat)) {
        gBody += '<p class="imp-step-sub"><b>Estas cifras no cubren tu cartera completa.</b> '
          + 'La ganancia latente sale de <b>' + gNLat + ' de tus ' + G.n_fondos_total
          + ' fondos</b>'
          + (G.realizado ? ', y la ya realizada de <b>' + gNReal + '</b>' : '')
          + (gFaltan ? '. De ' + gFaltan + (gFaltan === 1 ? ' no se puede' : ' no se pueden')
              + ' saber la base de costo' : '')
          + '.</p>';
      }
      gBody += '<div class="imp-buckets dos">' + gCajas + '</div>'
        + '<p class="imp-step-sub">'
        + (G.realizado ? 'Las dos <b>no se suman</b>: una está cerrada y la otra sigue viva. ' : '')
        + 'Base por <b>costo promedio ponderado</b>, con las acciones del DRIP contadas como lo '
        + 'que costaron'
        + (gCaptura.length ? ' — salvo los fondos cuya base viene de tu captura, donde el '
            + 'método de lotes lo eligió tu bróker' : '')
        + '.</p>';
      // Procedencia de la base cuando no sale del CSV. Va junto a las cifras, no al pie: es
      // parte de qué son, no una aclaración opcional.
      if (gCaptura.length) {
        gBody += '<p class="imp-step-sub">En <b>' + esc(gCaptura.join(", ")) + '</b> la base de '
          + 'costo no sale de tu CSV sino de <b>la captura de tu bróker</b> — el archivo no '
          + 'llega hasta la compra original. Por eso de esos fondos aparece la ganancia '
          + '<b>latente y nada más</b>: la captura describe lo que tienes hoy, no lo que '
          + 'vendiste. Y como no trae fecha de compra, esas posiciones <b>no tienen '
          + 'antigüedad</b>, que es lo que decide el tramo de 2 años en «En tu país».</p>';
      }
    }
    // ── Base fiscal tras el ROC ────────────────────────────────────────────────
    // Va DESPUÉS de las cajas y en panel aparte: es la misma posición en otro momento
    // ('tras_reclasificacion_anual'), no una tercera cifra que conviva con las de arriba.
    // Todas sus cifras vienen del MISMO alcance (`fiscal_roc.*_mercado`), nunca de los
    // totales de la cartera, que cubren más fondos.
    var F = G.fiscal_roc;
    if (F && F.n_fondos) {
      var fAlcance = (F.n_fondos === G.n_fondos_total)
        ? 'Tus ' + F.n_fondos + ' fondos'
        : F.n_fondos + ' de tus ' + G.n_fondos_total + ' fondos';
      gBody += '<div class="imp-fiscal">'
        + '<p class="imp-fiscal-lab">Tu base fiscal · tras la reclasificación del ROC</p>'
        + '<p class="imp-step-sub">' + esc(fAlcance) + ' (<b>' + esc(F.tickers.join(", "))
        + '</b>) te devolvieron parte de tu propio capital dentro de las distribuciones. Eso '
        + '<b>no cambia lo que pusiste</b> — cambia lo que el fisco considera que te costó, '
        + 'y por eso importa el día que vendas. Estimado con los avisos <b>19a</b> que '
        + 'publica cada fondo.</p>'
        + '<p class="imp-fiscal-par">Base de costo <b>' + money(F.base_mercado) + '</b>'
        + '<span class="imp-fiscal-flecha">&rarr;</span>base fiscal <b>' + money(F.base) + '</b></p>'
        + '<p class="imp-step-sub">Con esa base, la ganancia latente de <b>esos mismos fondos</b> '
        + 'es <b>' + money(F.no_realizado) + '</b> en vez de ' + money(F.no_realizado_mercado)
        + '.' + (F.realizado != null
            ? ' Y la ya realizada, <b>' + money(F.realizado) + '</b> en vez de '
              + money(F.realizado_mercado) + '.'
            : '')
        + ' <b>Las dos no se suman ni se restan:</b> son el mismo dinero medido en dos '
        + 'momentos — al comprar, y tras la reclasificación anual.</p>'
        + ((F.tickers_19a_sin_ajuste && F.tickers_19a_sin_ajuste.length)
            ? '<p class="imp-step-sub"><b>' + esc(F.tickers_19a_sin_ajuste.join(", "))
              + '</b> también publica avisos 19a, pero su ROC salió del costo que reporta tu '
              + 'bróker y ahí todavía no aparece — la reclasificación es de fin de año. '
              + 'Su base fiscal <b>no está ajustada arriba</b>, así que no lo leas como que '
              + 'ese fondo no tiene ROC.</p>'
            : '')
        + (F.roc_exceso > 0.01
            ? '<p class="imp-step-sub"><b>' + money(F.roc_exceso) + '</b> de ese ROC superó tu '
              + 'base de costo. Una base fiscal no baja de cero: ese excedente es ganancia de '
              + 'capital desde ya, no un costo negativo.</p>'
            : '')
        + '</div>';
    }

    if (gFaltan) {
      // Dos remedios distintos, y por eso dos listas. A los 19a no les FALTA ningún dato:
      // su costo está en la captura y se descarta a propósito, porque el bróker ya se lo
      // redujo por el ROC y encima le caería la serie 19a. Meterlos en el mismo saco
      // invitaría al cliente a aportar algo que ya aportó.
      var gNo19a = (G.tickers_captura_no_usada || []);
      var gSinDato = G.tickers_indeterminados.filter(function (t) {
        return gNo19a.indexOf(t) === -1;
      });
      if (gSinDato.length) {
        gBody += '<div class="imp-cta">Sin base de costo para <b>'
          + esc(gSinDato.join(", "))
          + '</b>: en tu CSV esas acciones llegaron por traspaso o el historial no alcanza hasta '
          + 'la compra original, y <b>tu captura tampoco trae su costo</b>. '
          + '<b>No las contamos como costo cero</b> — eso las haría parecer ganancia pura. Para '
          + 'verlas aquí necesitas el historial completo desde que abriste la posición, o el '
          + 'costo de esas posiciones en la captura de tu bróker.</div>';
      }
      if (gNo19a.length) {
        gBody += '<div class="imp-cta"><b>' + esc(gNo19a.join(", ")) + '</b> sí tiene costo en '
          + 'tu captura, y aun así no aparece arriba — <b>no te falta ningún dato</b>. Ese '
          + 'fondo reparte <b>retorno de capital</b>, y el costo que reporta tu bróker ya viene '
          + 'rebajado por el ROC que él mismo reclasificó. Usarlo aquí restaría ese ROC <b>dos '
          + 'veces</b> y te mostraría una ganancia inflada. Preferimos no darte la cifra a '
          + 'darte una mal medida.</div>';
      }
    }
    pasos.push(stepRow("Peldaño 5", "¿Y cuando vendas?", G.retencion_eeuu, null,
      gBody, "activo"));
  }
  }

  if (VISTA_ACTIVA === "pais") {
  // ---- Peldaño 6: lo que declaras en tu país (Fase 4) ----
  // Publica BASE y CRÉDITO, nunca una cifra de impuesto local. La tarifa del país de
  // residencia es progresiva sobre la renta GLOBAL del contribuyente, que la app no conoce:
  // inventarla sería el mismo error que el peldaño 3 evita al no publicar cifra sin país.
  // Por eso este peldaño no lleva monto en la cabecera — lleva las dos bases separadas.
  var L = D.impuesto_local;
  if (L) {
    // La frase de intro («Esta renta es de fuente extranjera… la base y el crédito»)
    // subió al lede de esta vista — un solo sitio, misma palabra.
    var lBody = '';

    lBody += '<div class="imp-buckets">'
      + '<div class="imp-bucket gris"><p class="imp-bucket-lab">Dividendos (bruto)</p>'
        + '<span class="imp-bucket-money">' + money(L.dividendos.bruto) + '</span>'
        + '<p class="imp-bucket-note">Lo repartido ANTES de la retención — es el bruto el que '
        + 'viaja a la declaración, no lo que entró a tu cuenta.</p></div>'
      + '<div class="imp-bucket ambar"><p class="imp-bucket-lab">Crédito por lo pagado a EE.UU.</p>'
        + '<span class="imp-bucket-money">'
        + money(L.credito_eeuu.definitivo != null ? L.credito_eeuu.definitivo
                                                  : L.credito_eeuu.monto) + '</span>'
        + '<p class="imp-bucket-note">Casi todos los países lo dejan descontar del impuesto '
        + 'propio. Es el dato que más se pierde el contribuyente: sin él, paga dos veces.</p></div>'
      + '</div>';

    // El crédito NO es todo lo retenido: lo que vuelve por ROC nunca llegó a ser impuesto, y
    // lo que no se pagó no se descuenta. Sin esta línea la cifra se infla — en el CSV de
    // Schwab, $41.29 de $60.75. Se explica siempre que haya devolución medida.
    if (L.credito_eeuu.definitivo != null && L.credito_eeuu.vuelve_por_roc > 0.005) {
      lBody += '<div class="imp-conc" style="border-left-color:var(--ambar)">'
        + 'Tu bróker te retuvo <b>' + money(L.credito_eeuu.monto) + '</b> al cobro, pero '
        + '<b>' + money(L.credito_eeuu.vuelve_por_roc) + '</b> vuelven solos al reclasificar el '
        + 'ROC. <b>Eso no es crédito</b>: lo que te devuelven nunca llegaste a pagarlo. El que '
        + 'puedes descontar es <b>' + money(L.credito_eeuu.definitivo) + '</b>. '
        + 'Llevar el total a tu declaración es reclamar un impuesto que no pagaste.</div>';
    } else if (L.credito_eeuu.definitivo == null) {
      lBody += '<div class="imp-conc">No podemos medir cuánto de esa retención vuelve por ROC, '
        + 'así que <b>' + money(L.credito_eeuu.monto) + '</b> es el <b>techo</b> del crédito, no '
        + 'la cifra final: si tu bróker reclasifica ROC, parte volverá y esa parte no se '
        + 'descuenta.</div>';
    }

    // El ROC se nombra sin decidir por el contribuyente: que su país reconozca el retorno de
    // capital de un ETF estadounidense lo decide SU ley, no la de EE.UU.
    if (L.dividendos.roc > 0.005) {
      lBody += '<div class="imp-conc">De ese bruto, EE.UU. trató como renta '
        + '<b>' + money(L.dividendos.gravable_eeuu) + '</b>; el resto, '
        + '<b>' + money(L.dividendos.roc) + '</b>, fue retorno de capital. '
        + '<b>Si tu país no reconoce el ROC de un fondo estadounidense, tu base es el bruto.</b> '
        + 'Eso lo decide la ley de tu país — por eso mostramos las dos cifras y no elegimos una.</div>';
    }

    // Ganancias realizadas, separadas por antigüedad: varios países cambian el tratamiento
    // en el corte de 2 años (en Colombia, ganancia ocasional contra renta ordinaria).
    var TR = L.realizado_por_tramo || {};
    var nV = (TR.ge_2y.n_ventas || 0) + (TR.lt_2y.n_ventas || 0) + (TR.sin_tramo.n_ventas || 0);
    if (nV > 0) {
      var anios = Math.round((L.corte_tramo_dias || 730) / 365);
      lBody += '<div class="imp-conc">Y por lo que <b>vendiste</b>: '
        + '<b>' + money(TR.ge_2y.monto) + '</b> con ' + anios + ' años o más de tenencia, '
        + '<b>' + money(TR.lt_2y.monto) + '</b> por debajo de ese corte. '
        + 'Van separadas porque varios países las gravan distinto según la antigüedad.</div>';
    }

    if (L.no_realizado_excluido != null) {
      lBody += '<div class="imp-conc">Lo que <b>no</b> has vendido ('
        + money(L.no_realizado_excluido) + ' de ganancia latente) <b>no entra aquí</b>: '
        + 'todavía no se declara.</div>';
    }

    lBody += '<div class="imp-cta">No te decimos cuánto pagarás: la tarifa de tu país es '
      + '<b>progresiva sobre tu renta total</b> —tu sueldo incluido—, y esta app solo ve tu '
      + 'portafolio. Con la base y el crédito de arriba, tu contador cierra la cuenta en un '
      + 'minuto. Poner un número aquí sería inventarte el dato que falta.</div>';

    pasos.push(stepRow("Peldaño 6", "¿Y en tu país?", null, null, lBody, "activo"));
  }

  // Peldaños reservados de fases futuras — sin contenido inventado. Hoy la lista va vacía.
  (D.slots_pendientes || []).forEach(function (s) {
    pasos.push(stepRow("Próximamente", s.titulo, null, null,
      '<p class="imp-step-sub">' + esc(s.nota) + ' <b>Pendiente</b> — llega en una fase posterior.</p>',
      "pendiente"));
  });
  }

  if (VISTAS_ESCALERA[VISTA_ACTIVA]) {
    set("impEscalera", pasos.join(""));
  } else {
    var _elEsc = document.getElementById("impEscalera");
    if (_elEsc) _elEsc.remove();
  }

  // ---- tabla por fondo ----
  if (VISTA_ACTIVA === "fondos") {
  var T = P.retenido || {};
  var hayDevuelto = (T.ya_devuelto && T.ya_devuelto.monto > 0.01);
  var conBuckets = D.declarado;                 // columnas Correcta/ROC/W-8BEN
  var np = '<span class="mut">no publ.</span>';
  var head = '<tr><th>Fondo</th><th>Bruto</th><th>ROC</th><th>Gravable</th>'
    + (D.declarado ? '<th>Te toca</th>' : '')
    + '<th>Al cobro</th>'
    + (hayDevuelto ? '<th>Devuelto</th>' : '')
    + (conBuckets ? '<th>Correcta</th><th class="c-ambar">ROC</th><th class="c-coral">W-8BEN</th>' : '')
    + '</tr>';
  var body = '';
  (D.fondos || []).forEach(function (f) {
    var rocCell = f.roc_pct == null ? '<span class="mut">—</span>' : (f.roc_pct.toFixed(0) + '%');
    body += '<tr>'
      + '<td class="tk">' + esc(f.ticker) + '</td>'
      + '<td>' + money(f.bruto) + '</td>'
      + '<td>' + rocCell + '</td>'
      + '<td>' + money(f.gravable) + '</td>'
      + (D.declarado ? '<td>' + (f.corresponde == null ? '—' : money(f.corresponde)) + '</td>' : '')
      + '<td>' + money(f.retenido) + '</td>'
      + (hayDevuelto ? '<td class="mut">' + (f.ya_devuelto > 0.01 ? money(f.ya_devuelto) : '—') + '</td>' : '')
      + (conBuckets ? (f.indeterminado
          ? '<td class="mut">' + np + '</td><td class="c-ambar">' + np + '</td><td class="c-coral">' + np + '</td>'
          : '<td class="mut">' + money(f.retencion_correcta) + '</td>'
            + '<td class="c-ambar">' + money(f.recuperable_roc) + '</td>'
            + '<td class="c-coral">' + money(f.gap_w8ben) + '</td>') : '')
      + '</tr>';
  });
  var totBuckets = (T.estado === "ok")
    ? '<td class="mut">' + money(T.correcta.monto) + '</td>'
      + '<td class="c-ambar">' + money(T.recuperable_roc.monto) + '</td>'
      + '<td class="c-coral">' + money(T.gap_w8ben.monto) + '</td>'
    : '<td class="mut">' + np + '</td><td class="c-ambar">' + np + '</td><td class="c-coral">' + np + '</td>';
  var tot = '<tr class="total">'
    + '<td>Cartera</td>'
    + '<td>' + money(P.bruto ? P.bruto.monto : 0) + '</td>'
    + '<td>' + (rocEfectivo == null ? '—' : rocEfectivo.toFixed(0) + '%') + '</td>'
    + '<td>' + money(P.gravable ? P.gravable.monto : 0) + '</td>'
    + (D.declarado ? '<td>' + money(P.corresponde ? P.corresponde.monto : 0) + '</td>' : '')
    + '<td>' + money(T.monto) + '</td>'
    + (hayDevuelto ? '<td class="mut">' + money(T.ya_devuelto.monto) + '</td>' : '')
    + (conBuckets ? totBuckets : '')
    + '</tr>';
  set("impTabla", head + body + tot);
  } else {
    var _elBlock = document.getElementById("impBlock");
    if (_elBlock) _elBlock.remove();
  }

  if (VISTA_ACTIVA === "recuperar") {
  // ---- Ruta A / Ruta B ----
  var A = D.ruta_a || {};
  var estimadoA = A.tiene_1042s ? '' : '<span class="imp-ruta-est">estimado — sin 1042-S cargado</span> ';
  var rutaA;
  if (A.sin_retencion && A.tiene_1042s) {
    rutaA = '<div class="imp-ruta"><p class="imp-ruta-h">Ruta A · el bróker ya lo resolvió</p>'
      + '<p class="imp-ruta-p">Tu 1042-S no muestra retención pendiente (casilla 7a en cero). No hay nada que reclamar por esta vía.</p></div>';
  } else {
    rutaA = '<div class="imp-ruta"><p class="imp-ruta-h">Ruta A · lo que vuelve solo (ROC)</p>'
      + '<p class="imp-ruta-p">' + estimadoA
        + 'El 1042-S <b>no se presenta — se lee</b>: si el bróker reclasificó el ROC, la <b>casilla 9</b> («Overwithheld tax repaid») debería decir <b>' + money(A.casilla9_esperada) + '</b>. '
        + 'Se descubre comparando las casillas 9 y 10 del formulario que te llega a inicio de año — no hay trámite que iniciar.</p>';
    if (A.tiene_1042s && A.veredicto === "pendiente") {
      rutaA += '<p class="imp-ruta-p">Tu 1042-S dice que <b>' + money(A.pendiente) + '</b> sigue en el IRS: esa parte va por la Ruta B.</p>';
    } else if (A.tiene_1042s && A.veredicto === "devuelto") {
      rutaA += '<p class="imp-ruta-p">Tu 1042-S confirma que el bróker ya devolvió <b>' + money(A.devuelto) + '</b>.</p>';
    }
    rutaA += '</div>';
  }

  var rutaB = '<div class="imp-ruta"><p class="imp-ruta-h">Ruta B · lo que hay que reclamar al IRS</p>'
    + '<p class="imp-ruta-p">El gap de tratado / W-8BEN no vuelve solo. Para recuperarlo:</p>'
    + '<ol>'
    + '<li>Solicita un <b>ITIN</b> con el formulario <b>W-7</b>.</li>'
    + '<li>Presenta un <b>1040-NR</b> del <b>año exacto</b> de la retención.</li>'
    + '<li>Adjunta copia de tu <b>1042-S</b> de ese año.</li>'
    + '<li>Tienes <b>3 años</b> desde la fecha de la retención para reclamar.</li>'
    + '</ol>'
    + '<p class="imp-ruta-p">Existe la <b>Excepción 1(b) del W-7</b> (ingreso pasivo con retención de terceros) para obtener el ITIN sin esperar a declarar. <b>Confírmala con tu bróker</b> — no está verificada con Schwab, no la des por garantizada.</p></div>';

  set("impRutas", rutaA + rutaB);

  set("impFoot",
    "Todas las cifras salen de objetos fiscales ya calculados sobre tu CSV y, si lo cargaste, tu 1042-S. "
    + "El ROC y su fuente vienen del cierre fiscal del fondo cuando existe, y de la estimación 19(a) del gestor mientras el año sigue abierto. "
    + "Esto no es asesoría fiscal: confirma con tu bróker o un asesor.");
  } else {
    ["impRutas", "impFoot"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.remove();
    });
  }
})();
</script>
<script>
/* Auto-alto del iframe. `components.html` fija el alto desde Python y no se adapta al
   contenido, así que cada componente reservaba cientos de píxeles de vacío. El iframe es
   same-origin (`srcdoc`), así que desde aquí se alcanza el propio <iframe> del documento
   padre y se le corrige el alto. NO se usa `streamlit:setFrameHeight`: ese canal es de
   componentes registrados con `declare_component`, no de `components.html`.
   Se mide `body.scrollHeight` y NO `documentElement.scrollHeight`: el segundo nunca baja
   del alto del viewport del iframe, así que nunca detectaría el vacío. */
(function () {
  "use strict";
  var fe = null;
  try { fe = window.frameElement; } catch (e) { fe = null; }
  if (!fe) return;   // cross-origin o abierto suelto: se queda el alto que fijó Python
  var aplicado = 0;
  function ajustar() {
    var h = Math.ceil(document.body.scrollHeight);
    if (!h || Math.abs(h - aplicado) <= 1) return;
    aplicado = h;
    fe.setAttribute("height", String(h));
    fe.style.height = h + "px";
  }
  window.__vdAjustarAlto = ajustar;
  ajustar();
  [60, 200, 500, 1200].forEach(function (ms) { setTimeout(ajustar, ms); });
  window.addEventListener("resize", ajustar);
  if (window.ResizeObserver) {
    /* Referencia fuerte a propósito: un ResizeObserver sin referencia puede recolectarse
       y dejar de avisar en silencio. */
    var ro = new ResizeObserver(ajustar);
    ro.observe(document.body);
    window.__vdAltoRO = ro;
  }
  /* Red de seguridad: ni el panel de navegador embebido ni Chrome headless disparan
     ResizeObserver ni `resize`. Los temporizadores sí corren en todos esos entornos. */
  setInterval(ajustar, 1000);
})();
</script>
