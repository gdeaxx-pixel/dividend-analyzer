<!-- Escrito y mantenido A MANO. Vista «Portafolios» (dona agrupada + cascada precio →
     dividendos → total), diseño aprobado en el artifact «Tus dos portafolios» (propuesta
     v3, sep-2026). Fuente de diseño: `Obsidian/APPs/Dividend-Analyzer/demos/portafolios-v3.html`.
     Los datos llegan ya calculados desde `ui/adapters.py::portafolios_data`: cifras,
     porcentajes y veredicto salen de Python; aquí solo se dibuja. La sección va sin título
     ni etiqueta a propósito (decisión de Daniel, sep-2026: la ruta ya dice Portafolios). El bloque de auto-alto del final es el de
     `tools/_auto_alto.py`, igual que los demás componentes. -->
<meta charset="utf-8">
<style>
  :root {
    --font-mono: "JetBrains Mono", "Fira Code", "Space Mono", ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    --ground:     #f4f7fa;
    --panel:      #ffffff;
    --panel-tint: #eef4f9;
    --ink:        #021C36;
    --ink-2:      #33475a;
    --ink-mut:    #6a7b8a;
    --hair:       #d5e0ea;
    --hair-soft:  #e6edf3;
    --accent:     #006497;
    --cash:       #1f8a5b;
    --loss:       #A32D2D;
    /* barra «Precio» y rampas de color por portafolio: f1→f3 Crecimiento, f4→f5 Dividendos */
    --bar-price:  #021C36;
    --f1:         #021C36;
    --f3:         #9fb3c5;
    --f4:         #006497;
    --f5:         #8fc0da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0b1420; --panel:#101d2b; --panel-tint:#142639; --ink:#eaf1f7; --ink-2:#c3d1de;
      --ink-mut:#8598a9; --hair:#26394c; --hair-soft:#1c2c3c; --accent:#3ea0d6; --cash:#35b07d;
      --loss:#e07a7a; --bar-price:#9fb6ca; --f1:#dbe6ef; --f3:#4d677f; --f4:#3ea0d6; --f5:#1d5676;
    }
  }
  :root[data-theme="light"] {
    --ground:#f4f7fa; --panel:#ffffff; --panel-tint:#eef4f9; --ink:#021C36; --ink-2:#33475a;
    --ink-mut:#6a7b8a; --hair:#d5e0ea; --hair-soft:#e6edf3; --accent:#006497; --cash:#1f8a5b;
    --loss:#A32D2D; --bar-price:#021C36; --f1:#021C36; --f3:#9fb3c5; --f4:#006497; --f5:#8fc0da;
  }
  :root[data-theme="dark"] {
    --ground:#0b1420; --panel:#101d2b; --panel-tint:#142639; --ink:#eaf1f7; --ink-2:#c3d1de;
    --ink-mut:#8598a9; --hair:#26394c; --hair-soft:#1c2c3c; --accent:#3ea0d6; --cash:#35b07d;
    --loss:#e07a7a; --bar-price:#9fb6ca; --f1:#dbe6ef; --f3:#4d677f; --f4:#3ea0d6; --f5:#1d5676;
  }

  * { box-sizing: border-box; border-radius: 0; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--font-sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .wrap { display: grid; gap: 20px; padding-bottom: 8px; }

  .panel { background: var(--panel); padding: clamp(20px, 4vw, 40px); }

  /* ── Asignación ── */
  .alloc-grid {
    display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 480px);
    justify-content: start; gap: clamp(28px, 7vw, 96px); align-items: start;
  }
  /* Reparto en barras (18-nov). Las dos pistas miden lo mismo y cada barra ocupa el peso
     de su portafolio, así que la proporción entre los dos se lee sin comparar ángulos.
     Dentro, un tramo por fondo. */
  .reparto { display: grid; gap: 20px; align-content: center; min-width: 0; }
  .rep-g { display: grid; gap: 7px; }
  .rep-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .rep-n {
    appearance: none; border: 0; background: transparent; color: inherit; font: inherit;
    padding: 0; cursor: pointer; font-weight: 600; font-size: 14px; text-align: left;
  }
  .rep-n:hover, .rep-n:focus-visible { color: var(--accent); }
  .rep-v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
  .rep-track { height: 16px; background: var(--panel-tint); }
  .rep-bar { display: flex; height: 100%; gap: 2px; }
  .rep-seg {
    appearance: none; border: 0; padding: 0; min-width: 3px; cursor: pointer;
    transition: opacity .2s ease, outline-color .2s ease; outline: 2px solid transparent; outline-offset: 1px;
  }
  .rep-seg.is-on { outline-color: var(--ink); }
  .rep-seg:focus-visible { outline-color: var(--accent); }
  .rep-total { display: grid; gap: 2px; border-top: 1px solid var(--hair); padding-top: 12px; }
  .c-k { font-size: 13px; color: var(--ink-mut); white-space: nowrap; }
  .c-v { font-family: var(--font-mono); font-weight: 700; font-size: 22px; line-height: 30px; letter-spacing: -.02em; }
  .c-s { font-size: 13px; color: var(--ink-2); white-space: nowrap; }

  .legend { display: grid; gap: 12px; min-width: 0; }
  .legend-groups { display: grid; gap: 20px; }
  .grp { display: grid; }
  .row {
    appearance: none; border: 0; background: transparent; color: inherit; font: inherit; text-align: left;
    width: 100%; min-height: 44px; padding: 0 12px; cursor: pointer;
    display: grid; align-items: center; gap: 12px;
    transition: opacity .2s ease, background-color .2s ease, box-shadow .2s ease;
  }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row-head { grid-template-columns: minmax(0, 1fr) 5.5rem 3.5rem; border-bottom: 1px solid var(--hair); }
  .row-fund { grid-template-columns: 10px minmax(0, 1fr) 5.5rem 3.5rem; }
  .g-name {
    font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-2); display: flex; align-items: center; gap: 10px; min-width: 0;
  }
  .g-name i, .sw { width: 10px; height: 10px; flex: none; }
  .tk { font-weight: 600; font-size: 16px; letter-spacing: .01em; }
  .r-mv { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-2); text-align: right; }
  .r-pct { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 16px; text-align: right; }
  .row-head .r-pct { font-weight: 700; }
  .row.is-on { background: var(--panel-tint); box-shadow: inset 2px 0 0 var(--ink); }
  .row.is-dim { opacity: .42; }

  .legend-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 34px; font-size: 13px; color: var(--ink-mut); padding-inline: 12px;
  }
  .reset {
    appearance: none; border: 0; background: none; font: inherit; cursor: pointer; flex: none;
    color: var(--accent); text-decoration: underline; text-underline-offset: 4px; padding: 6px 0;
    visibility: hidden;
  }
  .reset.is-visible { visibility: visible; }
  .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── Tarjetas ── */
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .cards.single { grid-template-columns: minmax(0, 1fr); }
  .card { background: var(--panel); padding: clamp(20px, 4vw, 36px); display: grid; align-content: start; transition: opacity .2s ease; }
  .cards.single .card {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); column-gap: clamp(32px, 6vw, 72px); align-items: center;
  }
  .card.is-dim { opacity: .5; }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
  .card-title { margin: 0; font-size: clamp(18px, 2.2vw, 21px); font-weight: 700; letter-spacing: -.015em; }
  .card-weight { font-size: 13px; color: var(--ink-mut); }
  .card-weight b { font-family: var(--font-mono); color: var(--ink); font-weight: 700; }
  .card-funds { margin: 4px 0 12px; color: var(--ink-2); font-size: 15px; }
  .weight { height: 3px; background: var(--hair-soft); position: relative; margin-bottom: 28px; }
  .weight i { position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--c); }
  .cards.single .card-weight, .cards.single .weight { display: none; }
  .cards.single .card-funds { margin-bottom: 24px; }

  .k { margin: 0; font-size: 13px; color: var(--ink-mut); }
  .big { margin: 2px 0 8px; display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }
  .big .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: clamp(20px, 2.6vw, 24px); font-weight: 700; letter-spacing: -.03em; line-height: 1.05; }
  .big .pct { font-family: var(--font-mono); font-size: 17px; font-weight: 600; }
  .pos { color: var(--cash); }
  .neg { color: var(--loss); }
  .verdict { margin: 0 0 24px; font-size: 15px; color: var(--ink-2); max-width: 44ch; min-height: 3.1em; text-wrap: pretty; }
  .cards.single .verdict { margin-bottom: 0; min-height: 0; }

  .wf { display: grid; gap: 16px; border-top: 1px solid var(--hair); padding-top: 18px; }
  .cards.single .wf { border-top: 0; padding-top: 0; }
  .wf-row { display: grid; gap: 8px; }
  /* La fila entera se pulsa para que explique su parte. Botón sin aspecto de botón: la
     gráfica no debe parecer un formulario. `.wf-row.total` (0,2,0) gana al reset (0,1,1)
     y conserva su línea de separación. */
  button.wf-row { width: 100%; background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .wf-row:hover .wf-k, .wf-row:focus-visible .wf-k { color: var(--accent); }
  .wf-row:hover .wf-bar, .wf-row:focus-visible .wf-bar { filter: brightness(1.08); }
  .wf-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .wf-row.total { border-top: 1px solid var(--hair); padding-top: 16px; }
  .wf-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: baseline; }
  .wf-label { display: block; margin: 0; font-size: 14px; line-height: 1.35; }
  .wf-k { font-weight: 600; color: var(--ink); margin-right: 6px; }
  .wf-sub { font-size: 13px; color: var(--ink-mut); }
  .wf-v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .wf-row.total .wf-v { font-weight: 700; }
  .wf-track { display: block; position: relative; height: 10px; }
  .wf-track::before {
    content: ""; position: absolute; top: -4px; bottom: -4px; left: var(--zero); width: 1px; background: var(--ink-mut); opacity: .55;
  }
  .wf-bar { position: absolute; top: 0; bottom: 0; min-width: 2px; }

  /* ---- Narración (14-nov) -------------------------------------------------------
     Patrón de `guia-graficas.md` § «Cómo se revela una gráfica»: una barra a la vez y el
     rótulo cuando esa barra para. Aquí ya existían las tres filas —precio, dividendos y el
     total— pero aparecían juntas y había que reconstruir el orden leyendo.
     El origen del crecimiento va con el signo: una barra negativa nace en el cero y avanza
     hacia la izquierda; si creciera desde su extremo izquierdo parecería ir al revés.
     ~4,5 s, y solo la primera vez que estas cifras se dibujan. */
  @keyframes wf-crece { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes wf-entra { from { opacity: 0; } to { opacity: 1; } }
  .narra .wf-bar { transform-origin: left center; animation: wf-crece 1100ms cubic-bezier(.33, 1, .68, 1) both; }
  .narra .wf-bar.neg { transform-origin: right center; }
  .narra .wf-row:nth-of-type(1) .wf-bar { animation-delay: 250ms; }
  .narra .wf-row:nth-of-type(2) .wf-bar { animation-delay: 1500ms; }
  .narra .wf-row:nth-of-type(3) .wf-bar { animation-delay: 2750ms; animation-duration: 800ms; }
  .narra .wf-v { animation: wf-entra 400ms ease-out both; }
  .narra .wf-row:nth-of-type(1) .wf-v { animation-delay: 1350ms; }
  .narra .wf-row:nth-of-type(2) .wf-v { animation-delay: 2600ms; }
  .narra .wf-row:nth-of-type(3) .wf-v { animation-delay: 3550ms; }
  @media (prefers-reduced-motion: reduce) {
    .narra .wf-bar, .narra .wf-v { animation: none; }
  }

  /* ---- Ficha de una fila (modal) · mismo patrón que Riesgo y Comparación ---- */
  #modal-porta { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.65); align-items: center; justify-content: center; padding: 20px; }
  #modal-porta.open { display: flex; }
  .modal-box { background: var(--panel); border: 1px solid var(--hair); max-width: 500px; width: 100%; padding: clamp(22px, 4vw, 34px); position: relative; max-height: 90vh; overflow-y: auto; animation: fadeIn .18s ease both; }
  .modal-close { position: absolute; top: 12px; right: 14px; font-family: var(--font-mono); font-size: 20px; font-weight: 700; background: none; border: none; color: var(--ink-mut); cursor: pointer; line-height: 1; padding: 4px 8px; transition: color .12s ease; }
  .modal-close:hover { color: var(--ink); }
  .modal-eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
  .modal-title { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--ink); margin: 0 0 14px; letter-spacing: -0.01em; }
  .modal-lede { font-size: 13.5px; line-height: 1.6; color: var(--ink-2); margin: 0 0 16px; }
  .modal-lede b { color: var(--ink); font-weight: 600; }
  .modal-formula { background: var(--panel-tint); border-left: 3px solid var(--accent); padding: 14px 16px; margin: 0 0 16px; }
  .mf-eq { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--accent); display: block; margin-bottom: 14px; line-height: 1.4; }
  .mf-table { width: 100%; border-collapse: collapse; }
  .mf-table td { font-family: var(--font-mono); font-size: 12.5px; padding: 5px 0; border-bottom: 1px solid var(--hair-soft); vertical-align: baseline; }
  .mf-table tr:last-child td { border-bottom: none; padding-top: 10px; font-weight: 700; font-size: 13px; }
  .mf-table td:last-child { text-align: right; }
  .mf-label { color: var(--ink-mut); }
  .mf-val { color: var(--ink); }
  .mf-table tr.is-on .mf-label, .mf-table tr.is-on .mf-val { color: var(--accent); font-weight: 700; }
  .modal-note { font-size: 12.5px; color: var(--ink-mut); margin: 0; line-height: 1.6; }
  .modal-note b { color: var(--ink-2); font-weight: 600; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }

  .b-price { background: var(--bar-price); }
  .b-div { background: var(--accent); }
  .b-gain { background: var(--cash); }
  .b-loss { background: var(--loss); }

  .foot { margin: 0; font-size: 13px; color: var(--ink-mut); max-width: 90ch; }

  @media (max-width: 760px) {
    .alloc-grid { grid-template-columns: minmax(0, 1fr); }
    .cards, .cards.single .card { grid-template-columns: minmax(0, 1fr); }
    .cards.single .verdict { margin-bottom: 24px; }
    .cards.single .wf { border-top: 1px solid var(--hair); padding-top: 18px; }
  }
  @media (max-width: 420px) {
    .row { padding-inline: 8px; gap: 8px; }
    .row-head { grid-template-columns: minmax(0, 1fr) 4.75rem 3rem; }
    .row-fund { grid-template-columns: 10px minmax(0, 1fr) 4.75rem 3rem; }
    .legend-foot { padding-inline: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rep-seg, .row, .card { transition: none; }
  }
</style>

<div class="wrap" id="port-root">
  <section class="panel" aria-label="Dónde está tu dinero hoy">
    <div class="alloc-grid">
      <div class="reparto">
        <div id="rep-filas"></div>
        <div class="rep-total" aria-live="polite">
          <span class="c-k" id="c-k"></span>
          <span class="c-v" id="c-v"></span>
          <span class="c-s" id="c-s"></span>
        </div>
      </div>
      <div class="legend">
        <div class="legend-groups" id="legend-groups"></div>
        <div class="legend-foot">
          <span>Elige un fondo o un portafolio para aislarlo.</span>
          <button type="button" class="reset" id="reset">Ver total</button>
        </div>
      </div>
    </div>
  </section>

  <div class="cards" id="cards"></div>

  <p class="foot">Retorno total = valor de hoy + efectivo cobrado − invertido. Resumen redondeado; no es una tasa anual.</p>
</div>

<div id="modal-porta" role="dialog" aria-modal="true" aria-labelledby="mp-title">
  <div class="modal-box">
    <button type="button" class="modal-close" id="mp-close" aria-label="Cerrar">×</button>
    <p class="modal-eyebrow" id="mp-eyebrow"></p>
    <h3 class="modal-title" id="mp-title"></h3>
    <p class="modal-lede" id="mp-lede"></p>
    <div class="modal-formula">
      <span class="mf-eq">Precio + Dividendos = Retorno total</span>
      <table class="mf-table"><tbody id="mp-tabla"></tbody></table>
    </div>
    <p class="modal-note" id="mp-note"></p>
  </div>
</div>

<script>
(function () {
  "use strict";
  const DATA = {{DATA_JSON}};
  const root = document.getElementById("port-root");
  if (!DATA || !Array.isArray(DATA.grupos) || !DATA.grupos.length) {
    root.hidden = true;
    return;
  }

  const RAMPA = { crec: ["--f1", "--f3"], div: ["--f4", "--f5"] };

  const $ = (id) => document.getElementById(id);
  const money = (v) => "$" + Math.abs(Math.round(v)).toLocaleString("en-US");
  const signed = (v) => (Math.round(v) < 0 ? "−" : "+") + money(v);
  const signedPct = (v) => (v < 0 ? "−" : "+") + Math.abs(v).toFixed(1) + "%";
  const pctTxt = (p) => (p > 0 && Math.round(p) === 0 ? "<1%" : Math.round(p) + "%");
  const plural = (n) => n + (n === 1 ? " fondo" : " fondos");
  const esc = (s) => String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;');

  function colorDe(clave, i, n) {
    const r = RAMPA[clave] || RAMPA.crec;
    if (n <= 1) return `var(${r[0]})`;
    const p = Math.round(100 - i * 100 / (n - 1));
    return `color-mix(in srgb, var(${r[0]}) ${p}%, var(${r[1]}))`;
  }

  const grupos = DATA.grupos.map((g) => {
    const fondos = (g.fondos || []).slice().sort((a, b) => b.mv - a.mv)
      .map((f, i, arr) => ({ ...f, g: g.clave, color: colorDe(g.clave, i, arr.length) }));
    return { ...g, fondos, color: colorDe(g.clave, 0, 1), tickers: fondos.map((f) => f.ticker).sort() };
  });
  const porClave = Object.fromEntries(grupos.map((g) => [g.clave, g]));
  const fondos = grupos.flatMap((g) => g.fondos);
  const single = grupos.length === 1;

  const segEls = {}, rowEls = [], cardEls = {};
  let pinned = null, hovered = null;

  const selDeFondo = (f) => (porClave[f.g].fondos.length === 1 ? { type: "group", id: f.g } : { type: "fund", id: f.ticker });

  function buildBarras() {
    const host = $("rep-filas");
    host.className = "reparto-filas";
    host.style.display = "grid";
    host.style.gap = "20px";
    grupos.forEach((g) => {
      const fila = document.createElement("div");
      fila.className = "rep-g";

      const head = document.createElement("div");
      head.className = "rep-head";
      const nombre = document.createElement("button");
      nombre.type = "button";
      nombre.className = "rep-n";
      nombre.textContent = g.nombre;
      const selG = { type: "group", id: g.clave };
      nombre.addEventListener("click", () => pin(selG));
      bindRow(nombre, selG);
      const cifra = document.createElement("span");
      cifra.className = "rep-v";
      cifra.textContent = money(g.mv) + " · " + pctTxt(g.pct);
      head.append(nombre, cifra);

      /* La pista mide el total; la barra, lo que pesa este portafolio. Las dos filas
         comparten escala, que es lo que la dona no dejaba comparar. */
      const track = document.createElement("div");
      track.className = "rep-track";
      const bar = document.createElement("div");
      bar.className = "rep-bar";
      bar.style.width = Math.max(0, Math.min(100, g.pct)).toFixed(2) + "%";
      g.fondos.forEach((f) => {
        const seg = document.createElement("button");
        seg.type = "button";
        seg.className = "rep-seg";
        seg.style.flex = String(Math.max(f.mv, 0.0001));
        seg.style.background = f.color;
        seg.setAttribute("aria-label", f.ticker + ", " + pctTxt(f.pct) + " de tu dinero");
        const sel = selDeFondo(f);
        seg.addEventListener("pointerenter", () => preview(sel));
        seg.addEventListener("pointerleave", () => preview(null));
        seg.addEventListener("click", () => pin(sel));
        bar.appendChild(seg);
        segEls[f.ticker] = seg;
      });
      track.appendChild(bar);
      fila.append(head, track);
      host.appendChild(fila);
    });
  }

  function bindRow(el, sel) {
    rowEls.push({ el, sel });
    el.addEventListener("pointerenter", () => preview(sel));
    el.addEventListener("pointerleave", () => preview(null));
    el.addEventListener("focus", () => preview(sel));
    el.addEventListener("blur", () => preview(null));
    el.addEventListener("click", () => pin(sel));
  }

  function buildLegend() {
    const host = $("legend-groups");
    grupos.forEach((g) => {
      const wrap = document.createElement("div");
      wrap.className = "grp";
      const uno = g.fondos.length === 1;
      const head = document.createElement("button");
      head.type = "button";
      head.className = "row row-head";
      const nombre = esc(g.nombre) + (uno ? ' · ' + esc(g.fondos[0].ticker) : '');
      head.innerHTML = '<span class="g-name"><i style="background:' + g.color + '"></i>' + nombre + '</span>' +
        '<span class="r-mv">' + money(g.mv) + '</span><span class="r-pct">' + pctTxt(g.pct) + '</span>';
      bindRow(head, { type: "group", id: g.clave });
      wrap.appendChild(head);
      if (!uno) {
        g.fondos.forEach((f) => {
          const r = document.createElement("button");
          r.type = "button";
          r.className = "row row-fund";
          r.innerHTML = '<i class="sw" style="background:' + f.color + '"></i><span class="tk">' + esc(f.ticker) + '</span>' +
            '<span class="r-mv">' + money(f.mv) + '</span><span class="r-pct">' + pctTxt(f.pct) + '</span>';
          bindRow(r, { type: "fund", id: f.ticker });
          wrap.appendChild(r);
        });
      }
      host.appendChild(wrap);
    });
  }

  const filas = (g) => [
    { id: "precio", k: "Precio", sub: "sobre todas tus acciones", from: 0, to: g.precio, v: g.precio,
      bar: g.precio >= 0 ? "b-price" : "b-loss", vc: g.precio < 0 ? "neg" : "" },
    { id: "dividendos", k: "Dividendos", sub: "lo que cobraste", from: g.precio, to: g.precio + g.dividendos, v: g.dividendos, bar: "b-div", vc: "" },
    { id: "retorno", k: "Retorno total", sub: "precio + dividendos", from: 0, to: g.retorno, v: g.retorno,
      bar: g.retorno >= 0 ? "b-gain" : "b-loss", vc: g.retorno >= 0 ? "pos" : "neg", total: true }
  ];
  function buildCards() {
    const host = $("cards");
    host.classList.toggle("single", single);
    /* Narrar UNA vez por cifras, no en cada repintado: Streamlit recrea el iframe en cada
       rerun, así que una bandera en memoria no sirve de nada. La firma son los datos; si no
       han cambiado, la gráfica sale ya puesta. `sessionStorage` puede fallar (ventana
       privada, cookies bloqueadas) y entonces simplemente no se anima. */
    let narra = false;
    try {
      const firma = JSON.stringify(grupos.map((g) => [g.clave, g.retorno, g.precio]));
      narra = sessionStorage.getItem("vd_narra_port") !== firma;
      if (narra) sessionStorage.setItem("vd_narra_port", firma);
    } catch (e) { narra = false; }

    const extremos = [0];
    grupos.forEach((g) => filas(g).forEach((r) => extremos.push(r.from, r.to)));
    const lo = Math.min(...extremos), hi = Math.max(...extremos);
    const pos = (x) => (hi === lo ? 0 : (x - lo) / (hi - lo) * 100);

    grupos.forEach((g) => {
      const tono = g.retorno >= 0 ? "pos" : "neg";
      const rows = filas(g).map((r) => {
        const a = pos(Math.min(r.from, r.to)), b = pos(Math.max(r.from, r.to));
        return '<button type="button" class="wf-row' + (r.total ? ' total' : '') + '"' +
          ' data-ficha="' + r.id + '" data-grupo="' + g.clave + '"' +
          ' aria-label="' + r.k + ' ' + signed(r.v) + '. Ver por qué.">' +
          '<span class="wf-head"><span class="wf-label"><span class="wf-k">' + r.k + '</span><span class="wf-sub">' + r.sub + '</span></span>' +
          '<span class="wf-v ' + r.vc + '">' + signed(r.v) + '</span></span>' +
          '<span class="wf-track"><i class="wf-bar ' + r.bar + (r.v < 0 ? ' neg' : '') + '" style="left:' + a.toFixed(2) + '%;width:' + (b - a).toFixed(2) + '%"></i></span></button>';
      }).join("");

      const card = document.createElement("article");
      card.className = "card";
      const peso = Math.max(0, Math.min(100, g.pct)).toFixed(2);
      card.innerHTML =
        '<div class="card-main">' +
          '<div class="card-top"><h2 class="card-title">' + esc(g.nombre) + '</h2><span class="card-weight"><b>' + pctTxt(g.pct) + '</b> de tu dinero</span></div>' +
          '<p class="card-funds">' + g.tickers.map(esc).join(' · ') + ' — ' + plural(g.fondos.length) + '</p>' +
          '<div class="weight" style="--w:' + peso + '%;--c:' + g.color + '"><i></i></div>' +
          '<p class="k">Retorno total</p>' +
          '<p class="big"><span class="num ' + tono + '">' + signed(g.retorno) + '</span><span class="pct ' + tono + '">' + signedPct(g.retorno_pct) + '</span></p>' +
          '<p class="verdict">' + (g.veredicto ? esc(g.veredicto) : '') + '</p>' +
        '</div>' +
        '<div class="wf' + (narra ? ' narra' : '') + '" style="--zero:' + pos(0).toFixed(2) + '%" role="group" aria-label="Cómo se llegó al retorno total">' + rows + '</div>';
      const sel = { type: "group", id: g.clave };
      card.addEventListener("pointerenter", () => preview(sel));
      card.addEventListener("pointerleave", () => preview(null));
      host.appendChild(card);
      cardEls[g.clave] = card;
    });
  }

  const same = (a, b) => !!a && !!b && a.type === b.type && a.id === b.id;
  const fondoDe = (t) => fondos.find((f) => f.ticker === t);
  const grupoDe = (sel) => (!sel ? null : sel.type === "group" ? sel.id : fondoDe(sel.id).g);
  function preview(sel) { hovered = sel; render(); }
  function pin(sel) { pinned = same(pinned, sel) ? null : sel; render(); }

  function render() {
    const sel = hovered || pinned;
    const activos = !sel ? fondos.map((f) => f.ticker)
      : sel.type === "fund" ? [sel.id]
      : porClave[sel.id].fondos.map((f) => f.ticker);

    fondos.forEach((f) => {
      const on = activos.includes(f.ticker);
      const seg = segEls[f.ticker];
      if (!seg) return;
      seg.style.opacity = sel && !on ? 0.2 : 1;
      seg.classList.toggle("is-on", !!sel && on);
    });

    rowEls.forEach(({ el, sel: rs }) => {
      const isOn = same(sel, rs);
      const related = !!sel && (isOn || (grupoDe(rs) === grupoDe(sel) && (sel.type === "group" || rs.type === "group")));
      el.classList.toggle("is-on", isOn);
      el.classList.toggle("is-dim", !!sel && !related);
      el.setAttribute("aria-pressed", same(pinned, rs) ? "true" : "false");
    });

    const g = grupoDe(sel);
    Object.entries(cardEls).forEach(([k, el]) => el.classList.toggle("is-dim", !!g && !single && g !== k));

    if (!sel) {
      $("c-k").textContent = "Valor de mercado";
      $("c-v").textContent = money(DATA.total_mv);
      $("c-s").textContent = plural(fondos.length);
    } else if (sel.type === "fund") {
      const f = fondoDe(sel.id);
      $("c-k").textContent = f.ticker;
      $("c-v").textContent = pctTxt(f.pct);
      $("c-s").textContent = `${money(f.mv)} · ${porClave[f.g].nombre}`;
    } else {
      const gg = porClave[sel.id];
      $("c-k").textContent = gg.nombre;
      $("c-v").textContent = pctTxt(gg.pct);
      $("c-s").textContent = `${money(gg.mv)} · ${gg.fondos.length === 1 ? gg.fondos[0].ticker : plural(gg.fondos.length)}`;
    }
    $("reset").classList.toggle("is-visible", !!pinned);
  }

  /* ---- La ficha de cada fila -------------------------------------------------------
     La gráfica decía QUÉ pasó; faltaba el porqué: que el precio de un fondo que reparte
     mucho baja por el propio reparto, y que lo cobrado ya viene con la retención
     descontada (`dividends_net_total`, el objeto fiscal — ver `ui/adapters.py`).
     La tabla repite las tres cifras que ya están en pantalla, sin aritmética nueva: así
     ningún redondeo puede descuadrar aquí. */
  const FICHAS = {
    precio: {
      t: "Lo que hizo el precio",
      lede: "Cuánto vale hoy el total de tus acciones frente a lo que costaron. Verlo en rojo no significa que ya perdiste ese dinero: lo pierdes solo si vendes a este precio.",
      nota: "En los fondos que reparten mucho, parte de la caída es el propio reparto: el fondo entrega el efectivo y su precio baja ese mismo día. Ese dinero no desapareció, está en la fila de abajo."
    },
    dividendos: {
      t: "Lo que cobraste",
      lede: "El dividendo que te pagaron estos fondos, <b>ya con la retención de impuestos descontada</b>. Es dinero que está en tu cuenta: lo puedes gastar o reinvertir.",
      nota: "El desglose de lo retenido, fondo por fondo, está en Impuestos."
    },
    retorno: {
      t: "Lo que te queda",
      lede: "Precio y dividendos juntos: lo que de verdad ganaste o perdiste con este portafolio hasta hoy. <b>Es la fila que importa.</b>",
      nota: "Puede salir en verde aunque el precio esté en rojo: pasa cuando lo que cobraste alcanza a cubrir la caída."
    }
  };

  const md = document.getElementById("modal-porta");
  let abridor = null;

  function fichaFilas(g) {
    return filas(g).map((r) => ({ id: r.id, k: r.k, v: signed(r.v) }));
  }

  function abrirFicha(clave, grupo, boton) {
    const g = porClave[grupo], f = FICHAS[clave];
    if (!g || !f) return;
    abridor = boton;
    document.getElementById("mp-eyebrow").textContent = g.nombre;
    document.getElementById("mp-title").textContent = f.t;
    document.getElementById("mp-lede").innerHTML = f.lede;
    document.getElementById("mp-note").textContent = f.nota;
    document.getElementById("mp-tabla").innerHTML = fichaFilas(g).map((r) =>
      '<tr class="' + (r.id === clave ? "is-on" : "") + '">' +
      '<td class="mf-label">' + r.k + '</td><td class="mf-val">' + r.v + '</td></tr>').join("");
    /* Dentro de un iframe auto-dimensionado, `position: fixed` se centra en la altura del
       iframe y el modal cae fuera de la pantalla. Mismo `abrir()` que Comparación (#188). */
    const box = md.querySelector(".modal-box");
    let top = 20;
    md.classList.add("open");
    try {
      const fe = window.frameElement;
      if (fe) {
        const r = fe.getBoundingClientRect(), vh = fe.ownerDocument.defaultView.innerHeight;
        box.style.maxHeight = (vh - 40) + "px";
        top = Math.max(20, -r.top + Math.max(20, (vh - box.offsetHeight) / 2));
        /* Centrarlo en la ventana no basta: el modal vive DENTRO del iframe y lo que
           sobresalga de su alto se recorta (medido: la nota del pie quedaba cortada).
           Así que además se sujeta al alto del propio iframe. */
        top = Math.max(20, Math.min(top, document.documentElement.scrollHeight - box.offsetHeight - 20));
      }
    } catch (e) {}
    md.style.alignItems = "flex-start";
    md.style.paddingTop = top + "px";
    document.getElementById("mp-close").focus();
  }

  function cerrarFicha() {
    md.classList.remove("open");
    if (abridor) { try { abridor.focus(); } catch (e) {} abridor = null; }
  }

  /* Delegado en el contenedor: `buildCards()` recrea las tarjetas en cada repintado. */
  $("cards").addEventListener("click", (e) => {
    const fila = e.target.closest(".wf-row");
    if (fila) abrirFicha(fila.dataset.ficha, fila.dataset.grupo, fila);
  });
  document.getElementById("mp-close").addEventListener("click", cerrarFicha);
  md.addEventListener("click", (e) => { if (e.target === md) cerrarFicha(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && md.classList.contains("open")) cerrarFicha(); });

  $("reset").addEventListener("click", () => pin(null));
  buildBarras();
  buildLegend();
  buildCards();
  render();
})();
</script>
<script>
/* Auto-alto del iframe. `components.html` fija el alto desde Python y no se adapta al
   contenido, así que cada componente reservaba cientos de píxeles de vacío. El iframe es
   same-origin (`srcdoc`), así que desde aquí se alcanza el propio <iframe> del documento
   padre y se le corrige el alto. NO se usa `streamlit:setFrameHeight`: ese canal es de
   componentes registrados con `declare_component`, no de `components.html`.
   Se mide `body.scrollHeight` y NO `documentElement.scrollHeight`: el segundo nunca baja
   del alto del viewport del iframe, así que nunca detectaría el vacío. */
(function () {
  "use strict";
  var fe = null;
  try { fe = window.frameElement; } catch (e) { fe = null; }
  if (!fe) return;   // cross-origin o abierto suelto: se queda el alto que fijó Python
  var aplicado = 0;
  function ajustar() {
    var h = Math.ceil(document.body.scrollHeight);
    if (!h) return;
    /* Streamlit >=1.52 envuelve el iframe en un contenedor con `flex: 0 0 <alto de Python>`
       que no sigue al iframe: sin esto queda el hueco (o el solape) entre ese alto y el real.
       Se re-aplica en cada llamada porque un rerun puede reescribir el estilo del contenedor. */
    var cont = fe.parentElement;
    if (cont && cont.style.flexBasis !== h + "px") cont.style.flexBasis = h + "px";
    if (Math.abs(h - aplicado) <= 1) return;
    aplicado = h;
    fe.setAttribute("height", String(h));
    fe.style.height = h + "px";
  }
  window.__vdAjustarAlto = ajustar;
  ajustar();
  [60, 200, 500, 1200].forEach(function (ms) { setTimeout(ajustar, ms); });
  window.addEventListener("resize", ajustar);
  if (window.ResizeObserver) {
    /* Referencia fuerte a propósito: un ResizeObserver sin referencia puede recolectarse
       y dejar de avisar en silencio. */
    var ro = new ResizeObserver(ajustar);
    ro.observe(document.body);
    window.__vdAltoRO = ro;
  }
  /* Red de seguridad: ni el panel de navegador embebido ni Chrome headless disparan
     ResizeObserver ni `resize`. Los temporizadores sí corren en todos esos entornos. */
  setInterval(ajustar, 1000);
})();
</script>
