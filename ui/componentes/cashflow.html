<!-- GENERADO POR tools/extract_cashflow.py — NO EDITAR A MANO.
     Fuente: el demo del artifact. Para cambiar algo, se cambia el demo y se regenera. -->
<meta charset="utf-8">
<style>
  :root {
    --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
    --font-mono: "JetBrains Mono", "Fira Code", "Space Mono", ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    --ground:      #f4f7fa;
    --panel:       #ffffff;
    --panel-tint:  #eef4f9;
    --ink:         #021C36;
    --ink-2:       #33475a;
    --ink-mut:     #6a7b8a;
    --hair:        #d5e0ea;
    --hair-soft:   #e6edf3;

    --anchor:      #021C36;
    --drip:        #006497;
    --cash:        #1f8a5b;
    --loss:        #A32D2D;
    --loss-soft:   #cf8a8a;
    --loss-bg:     rgba(163,45,45,0.10);
    --accent:      #006497;
    --accent-tint: rgba(0,100,151,0.10);
    --warn:        #a06a1a;
    --mark:        #534AB7;

    --sq-off:      #dbe3ea;
    --tip-bg:      #021C36;
    --tip-ink:     #eaf2f8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground:     #0b1420;
      --panel:      #101d2b;
      --panel-tint: #142639;
      --ink:        #eaf1f7;
      --ink-2:      #c3d1de;
      --ink-mut:    #8598a9;
      --hair:       #26394c;
      --hair-soft:  #1c2c3c;

      --anchor:     #b9c9d8;
      --drip:       #3ea0d6;
      --cash:       #35b07d;
      --loss:       #e07a7a;
      --loss-soft:  #9c5555;
      --loss-bg:    rgba(224,122,122,0.14);
      --accent:     #3ea0d6;
      --accent-tint: rgba(62,160,214,0.14);
      --warn:       #d9a441;
      --mark:       #AFA9EC;

      --sq-off:     #2b4056;
      --tip-bg:     #eaf1f7;
      --tip-ink:    #0b1420;
    }
  }
  :root[data-theme="light"] {
    --ground:#f4f7fa; --panel:#ffffff; --panel-tint:#eef4f9; --ink:#021C36; --ink-2:#33475a;
    --ink-mut:#6a7b8a; --hair:#d5e0ea; --hair-soft:#e6edf3; --anchor:#021C36; --drip:#006497;
    --cash:#1f8a5b; --loss:#A32D2D; --loss-soft:#cf8a8a; --loss-bg:rgba(163,45,45,0.10);
    --accent:#006497; --accent-tint:rgba(0,100,151,0.10); --sq-off:#dbe3ea; --tip-bg:#021C36; --tip-ink:#eaf2f8;
    --warn:#a06a1a; --mark:#534AB7;
  }
  :root[data-theme="dark"] {
    --ground:#0b1420; --panel:#101d2b; --panel-tint:#142639; --ink:#eaf1f7; --ink-2:#c3d1de;
    --ink-mut:#8598a9; --hair:#26394c; --hair-soft:#1c2c3c; --anchor:#b9c9d8; --drip:#3ea0d6;
    --cash:#35b07d; --loss:#e07a7a; --loss-soft:#9c5555; --loss-bg:rgba(224,122,122,0.14);
    --accent:#3ea0d6; --accent-tint:rgba(62,160,214,0.14); --sq-off:#2b4056; --tip-bg:#eaf1f7; --tip-ink:#0b1420;
    --warn:#d9a441; --mark:#AFA9EC;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

  .wrap {
    max-width: 940px;
    margin: 0 auto;
    padding: clamp(20px, 4vw, 48px) clamp(16px, 4vw, 40px) 64px;
  }

  /* ---- navegación: RUTA (breadcrumb) — Categoría › Vista › ETF, cada segmento un
     menú desplegable. Colapsa dos niveles en una sola línea y el "›" muestra
     el anidamiento; las secciones quedan como tabs debajo. ---- */
  .crumb { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .crumb[hidden] { display: none; }
  .crumb-seg { position: relative; }
  .crumb-seg[hidden] { display: none; }
  .crumb-btn {
    font-family: var(--font-mono); font-size: 15px; font-weight: 700; letter-spacing: 0.01em;
    padding: 6px 10px; border: 1px solid transparent; background: none; color: var(--ink);
    cursor: pointer; line-height: 1; display: inline-flex; align-items: center; gap: 8px;
    transition: background .15s ease, border-color .15s ease;
  }
  .crumb-btn:hover { border-color: var(--hair); }
  .crumb-btn[aria-expanded="true"] { background: var(--panel-tint); border-color: var(--hair); }
  .crumb-caret { font-size: 10px; color: var(--ink-mut); }
  .crumb-sep { font-family: var(--font-mono); font-size: 16px; color: var(--ink-mut); }
  .crumb-sep[hidden] { display: none; }
  .crumb-menu {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; min-width: 160px;
    background: var(--panel); border: 1px solid var(--hair); box-shadow: 0 8px 26px rgba(0,0,0,.22);
    padding: 4px; display: flex; flex-direction: column;
  }
  .crumb-menu[hidden] { display: none; }
  .crumb-item {
    font-family: var(--font-mono); font-size: 13px; font-weight: 600; text-align: left;
    padding: 8px 12px; border: none; background: none; color: var(--ink-2); cursor: pointer;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
    transition: background .12s ease, color .12s ease;
  }
  .crumb-item:hover { background: var(--panel-tint); color: var(--ink); }
  .crumb-item.active { color: var(--ink); font-weight: 700; }
  .crumb-item.active::after { content: "●"; margin-left: auto; font-size: 8px; color: var(--accent); }
  .crumb-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* enlace a la explicación de la sección activa: vive al final de la ruta, que ya
     es el título de dónde estás, así que aparece en todas las vistas sin duplicarse */
  .crumb-help {
    margin-left: auto; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
    color: var(--ink-mut); background: none; border: none; padding: 6px 2px; cursor: pointer;
    white-space: nowrap; transition: color .15s ease;
  }
  .crumb-help:hover { color: var(--accent); text-decoration: underline; }
  .crumb-help:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- Modular Circuitry: la ruta es la misma superficie que la página,
     no una caja aparte — fondo sólido var(--ground) exacto, sin patrones,
     con borde dashed y tipografía mono en mayúsculas como único acento. */
  .crumb {
    position: relative; gap: 0; margin: 0 0 26px; padding: 13px 16px;
    background: var(--ground); border: 1px dashed var(--hair);
  }
  .crumb-btn {
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink);
    position: relative; z-index: 1; border-radius: 0;
  }
  .crumb-btn:hover { border-color: var(--accent); }
  .crumb-btn[aria-expanded="true"] {
    background: var(--accent-tint); border-color: var(--accent); color: var(--accent);
  }
  .crumb-caret { color: var(--ink-mut); }
  .crumb-btn[aria-expanded="true"] .crumb-caret { color: var(--accent); }
  /* el "›" original es un nodo de texto, no CSS content — se apaga con
     font-size:0 en el propio span y el "|" nuevo se dibuja aparte */
  .crumb-sep { color: transparent; font-size: 0; position: relative; z-index: 1; margin: 0 6px; }
  .crumb-sep::before {
    content: "|"; display: inline-block; color: var(--ink-mut); opacity: .6; font-size: 13px;
  }
  .crumb-menu {
    border-radius: 0; background: var(--ground); border: 1px dashed var(--hair);
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
  }
  .crumb-item {
    font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink);
    border-bottom: 1px dashed var(--hair);
  }
  .crumb-item:last-child { border-bottom: none; }
  .crumb-item:hover { background: var(--accent-tint); color: var(--accent); padding-left: 16px; }
  .crumb-item.active { color: var(--accent); }
  .crumb-item.active::after { color: var(--accent); }
  .crumb-help {
    color: var(--ink-mut); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
    position: relative; z-index: 1;
  }
  .crumb-help:hover { color: var(--accent); }

  .etf-cta {
    font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--panel);
    background: var(--accent); border: none; padding: 10px 18px; cursor: pointer;
    transition: opacity .15s ease;
  }
  .etf-cta:hover { opacity: .88; }
  #etf-view[hidden], #etf-soon[hidden], #view-comparacion[hidden], #view-metodo[hidden] { display: none; }


  .panel[hidden] { display: none; }

  /* ---- placeholder "en diseño" (secciones 2 y 3) ---- */
  .soon { padding: 8px 2px 0; }
  .soon-badge {
    display: inline-block; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
    border: 1px solid var(--accent); padding: 4px 10px; margin-bottom: 18px;
  }
  .soon-title { font-family: var(--font-mono); font-size: clamp(20px, 3vw, 27px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; margin: 0 0 12px; text-wrap: balance; max-width: 22ch; }
  .soon-lede { font-size: 15px; line-height: 1.55; color: var(--ink-2); max-width: 56ch; margin: 0 0 30px; }
  .soon-lede b { color: var(--ink); font-weight: 600; }
  /* mini-rail fantasma: insinúa la estructura paso a paso que tendrá */
  .ghost-rail { display: flex; gap: 10px; margin-bottom: 26px; opacity: .5; }
  .ghost-step { flex: 1; max-width: 90px; }
  .ghost-bar { height: 4px; background: var(--hair); margin-bottom: 7px; }
  .ghost-lab { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-mut); }
  .ghost-body { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(20px, 4vw, 40px); align-items: end; }
  .ghost-plot { display: flex; align-items: flex-end; gap: 14px; height: 180px; }
  .ghost-plot > div { flex: 1; background: var(--panel-tint); border: 1px dashed var(--hair); }
  .ghost-side { display: flex; flex-direction: column; gap: 12px; }
  .ghost-line { height: 12px; background: var(--panel-tint); }
  .ghost-line.short { width: 60%; }

  /* ---- step rail (sticky) — 8 pasos de ANCHO IGUAL (flex-basis:0) ---- */
  .rail { display: flex; gap: 10px; margin: 16px 0 18px; overflow-x: auto; padding: 8px 0 6px; position: sticky; top: 0; background: var(--ground); z-index: 5; }
  .step { flex: 1 1 0; min-width: 80px; display: flex; flex-direction: column; gap: 7px; align-items: center; text-align: center; }
  .step.clickable { cursor: pointer; }
  .step.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .step-bar { height: 4px; width: 100%; background: var(--hair); transition: background .15s ease; }
  .step.done .step-bar { background: var(--accent); }
  .step.now .step-bar { background: var(--loss); }
  .step-lab { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-mut); line-height: 1.25; white-space: nowrap; }
  .step.now .step-lab { color: var(--loss); font-weight: 700; }
  .step.done .step-lab { color: var(--ink-2); }
  .step.clickable:hover .step-lab { color: var(--accent); }
  .step.now.clickable:hover .step-lab { color: var(--loss); }

  /* ---- section frame ---- */
  .sec { margin-top: 32px; }
  .sec.closer { margin-top: 18px; }
  /* divisor cockpit -> cierre */
  .closer-divider { height: 1px; background: var(--hair); margin: 18px 0 0; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin: 0 0 4px;
  }
  .sec-note { font-size: 12px; color: var(--ink-mut); margin: 5px 0 0; }

  /* explicación única del paso (dentro del cockpit). min-height medido con Chrome
     headless sobre los 8 textos reales (6 caen en 2 líneas = 59px, 2 en 1 línea =
     43px) — no es una estimación en em, es el máximo real + margen de seguridad. */
  .step-note {
    font-size: 13.5px; line-height: 1.45; color: var(--ink); background: var(--panel-tint); border-left: 3px solid var(--accent);
    padding: 10px 15px; margin: 12px 0 0; max-width: 78ch; min-height: 62px; box-sizing: border-box;
  }
  .step-note b { color: var(--accent); }

  /* ---- verdict (compacto) ---- */
  .verdict {
    background: var(--panel); border: 1px solid var(--hair); border-left: 4px solid var(--ink-mut);
    padding: 16px clamp(18px, 3vw, 26px); transition: border-left-color .2s ease;
    display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(20px, 4vw, 40px); align-items: center;
  }
  .v-kick { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; color: var(--ink-mut); text-transform: uppercase; margin: 0 0 6px; transition: color .2s ease; }
  .v-big { font-family: var(--font-mono); font-weight: 700; font-size: clamp(24px, 3.6vw, 34px); line-height: 0.95; color: var(--ink); letter-spacing: -0.01em; transition: color .2s ease; }
  .v-big.up { color: var(--accent); }
  .v-big.loss { color: var(--loss); }
  .v-pct { font-family: var(--font-mono); font-size: clamp(14px, 2vw, 16px); color: var(--ink-mut); font-weight: 600; margin-top: 6px; transition: color .2s ease; }
  .v-pct.up { color: var(--accent); }
  .v-pct.loss { color: var(--loss); }
  .v-pct-lab { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--ink-mut); }
  .v-pct-sep { color: var(--ink-mut); }

  .io { align-self: center; display: flex; flex-direction: column; gap: 18px; }
  .io-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 14px; }
  .io-lab { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-mut); text-align: right; }
  .io-track { position: relative; height: 34px; background: var(--panel-tint); border: 1px solid var(--hair-soft); }
  .io-fill { position: absolute; inset: 0 auto 0 0; display: flex; align-items: center; transition: width .3s cubic-bezier(.2,.8,.25,1), background .2s ease; }
  .io-fill span { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--panel); padding-left: 10px; white-space: nowrap; }
  .io-in  .io-fill { background: var(--anchor); }
  .io-out .io-fill { background: var(--loss); }
  .io-ghost { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-start; transition: padding-left .3s cubic-bezier(.2,.8,.25,1); }
  .io-ghost span { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mut); font-weight: 600; white-space: nowrap; transition: color .2s ease, margin-left .2s ease; }

  /* ---- waterfall ---- */
  .fall-scroll { overflow-x: auto; margin-top: 12px; padding-bottom: 4px; }
  .fall { position: relative; min-width: 820px; padding: 12px 8px 88px; }
  .plot { position: relative; height: 300px; display: flex; align-items: flex-end; gap: clamp(5px, 1.1vw, 13px); border-bottom: 1px solid var(--hair); }
  .col { position: relative; flex: 1; height: 100%; }
  .seg {
    position: absolute; left: 0; right: 0; overflow: hidden; min-height: 3px;
    transform: scaleY(0); transform-origin: bottom; animation: grow .55s cubic-bezier(.2,.8,.25,1) forwards;
  }
  /* barras que ya estaban en pasos previos: se quedan quietas, no re-animan */
  .seg.settled { animation: none; transform: scaleY(1); }
  .col.reserved { pointer-events: none; }
  .slot-tick { position: absolute; bottom: 0; left: 50%; width: 1px; height: 8px; background: var(--hair); }
  .slot-ghost {
    position: absolute; top: 100%; left: -2px; right: -2px; padding-top: 12px; text-align: center;
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--ink-mut); opacity: .42; line-height: 1.2;
  }
  .seg.s-anchor  { background: var(--anchor); }
  .seg.s-drip    { background: var(--drip); }
  .seg.s-transito{ background: var(--accent-tint); border: 2px solid var(--accent); }
  .seg.s-cash    { background: var(--cash); }
  .seg.s-loss    { background: var(--loss); }

  .costline { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--loss); z-index: 3; animation: fadeIn .4s ease both; }
  /* El rótulo se parte en dos líneas y se acota al ancho de UNA columna: con 8
     slots ya no cabe en una sola línea sin invadir la columna vecina. Va por
     encima de la línea, donde la primera columna ya no dibuja nada. */
  .costline .cl-lab {
    position: absolute; bottom: 3px; left: 0; max-width: 92px; background: var(--ground); padding: 0 6px 0 0;
    font-family: var(--font-mono); font-size: 10px; line-height: 1.2; color: var(--loss); font-weight: 600;
  }
  .gap-band {
    position: absolute; left: 0; right: 0; background: var(--loss-bg);
    background-image: repeating-linear-gradient(135deg, transparent 0 6px, var(--loss-soft) 6px 7px);
    display: flex; align-items: center; justify-content: center; animation: fadeIn .4s ease both; animation-delay: .3s;
  }
  .gap-band span {
    font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--loss);
    background: var(--ground); padding: 3px 8px; white-space: nowrap;
  }

  .col-cap { position: absolute; top: 100%; left: -2px; right: -2px; padding-top: 12px; text-align: center; }
  .cap-amt { font-family: var(--font-mono); font-size: 13.5px; font-weight: 700; }
  .cap-amt.up { color: var(--drip); } .cap-amt.dn { color: var(--loss); } .cap-amt.base { color: var(--ink); } .cap-amt.cashc { color: var(--cash); }
  /* 2.5em = dos líneas a line-height 1.25. Con 8 columnas angostas unos labels
     envuelven y otros no; reservar siempre dos líneas alinea el subtítulo y el
     acumulado de las 8 columnas en la misma horizontal. */
  .cap-lab { font-family: var(--font-sans); font-size: 11px; color: var(--ink-mut); line-height: 1.25; margin-top: 3px; min-height: 2.5em; }
  /* mismo margin-top que .cap-run: son la misma línea de la fila (subtítulo o
     acumulado, nunca ambos) y deben caer en la misma horizontal. */
  .cap-sub { font-family: var(--font-sans); font-size: 10px; color: var(--accent); font-style: italic; margin-top: 4px; }
  .cap-run { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-2); margin-top: 4px; }
  .cap-run::before { content: "→ "; color: var(--ink-mut); }

  /* ---- waffle ---- */
  .waffle-wrap { display: grid; grid-template-columns: auto 1fr; gap: clamp(24px, 5vw, 52px); margin-top: 24px; align-items: start; }
  @media (max-width: 620px) { .waffle-wrap { grid-template-columns: 1fr; } }
  .grid {
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px;
    width: clamp(220px, 42vw, 300px);
  }
  .sq { aspect-ratio: 1; opacity: 0; animation: pop .35s ease forwards; }
  .sq.q-anchor { background: var(--anchor); }
  .sq.q-drip   { background: var(--drip); }
  .sq.q-cash   { background: var(--cash); }
  .sq.q-off    { background: var(--sq-off); }
  .sq.q-sd, .sq.q-sl { position: relative; border: 1px solid var(--loss-soft); }
  .sq.q-sd { background: var(--loss-bg); }
  .sq.q-sl { background: transparent; }
  .sq.q-sd::after, .sq.q-sl::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top right, transparent calc(50% - 0.8px), var(--loss) calc(50% - 0.8px), var(--loss) calc(50% + 0.8px), transparent calc(50% + 0.8px));
    opacity: .85;
  }
  .sq.q-sl::after { opacity: .5; }
  .sq.q-transito { background: var(--accent-tint); border: 1px solid var(--accent); }

  /* reserva de 3 filas (medido con Chrome headless sobre los 8 pasos reales:
     1-2 filas = 130px, 3 filas = 155px) — el # de categorías crece de 1 a 3
     según el paso, nunca mueve lo de abajo. */
  .legend { display: flex; flex-direction: column; gap: 14px; min-height: 155px; }
  .leg-row { display: flex; align-items: flex-start; gap: 11px; }
  .leg-sw { display: flex; gap: 3px; margin-top: 2px; flex-shrink: 0; }
  .leg-sw i { width: 15px; height: 15px; display: block; }
  .sw-anchor { background: var(--anchor); }
  .sw-drip { background: var(--drip); }
  .sw-cash { background: var(--cash); }
  .sw-struck { border: 1px solid var(--loss-soft); position: relative; background: var(--loss-bg); }
  .sw-struck::after { content:""; position:absolute; inset:0; background: linear-gradient(to top right, transparent calc(50% - 0.8px), var(--loss) calc(50% - 0.8px), var(--loss) calc(50% + 0.8px), transparent calc(50% + 0.8px)); }
  .leg-txt strong { font-size: 13.5px; color: var(--ink); font-weight: 600; }
  .leg-txt .leg-amt { font-family: var(--font-mono); }
  .leg-txt small { display: block; font-size: 11.5px; color: var(--ink-mut); margin-top: 1px; }

  .surv {
    margin-top: 20px; padding: 16px 18px; background: var(--panel-tint); border-left: 3px solid var(--loss);
    font-size: 14px; color: var(--ink); font-weight: 500; min-height: 78px; box-sizing: border-box;
  }
  .surv b { font-family: var(--font-mono); }
  .surv .alive { color: var(--cash); } .surv .dead { color: var(--loss); }
  .waffle-note { font-size: 11.5px; color: var(--ink-mut); margin: 14px 0 0; }
  .waffle-note .num { color: var(--ink-2); }

  .foot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--hair); font-size: 11.5px; color: var(--ink-mut); }

  /* ---- tooltip ---- */
  #tip {
    position: fixed; z-index: 50; pointer-events: none; opacity: 0; transform: translateY(4px);
    transition: opacity .12s ease, transform .12s ease;
    background: var(--tip-bg); color: var(--tip-ink); padding: 8px 11px; max-width: 240px;
    font-size: 12px; line-height: 1.4; box-shadow: 0 6px 22px rgba(0,0,0,.28);
  }
  #tip.on { opacity: 1; transform: translateY(0); }
  #tip .t-h { font-family: var(--font-mono); font-weight: 700; font-size: 12px; margin-bottom: 2px; }
  #tip .t-v { font-family: var(--font-mono); }

  /* ============ COMPARACIÓN · Total Return Graph ============ */
  .cmp-head { padding-bottom: 12px; border-bottom: 1px solid var(--hair); margin-bottom: 18px; }
  .cmp-title { font-family: var(--font-mono); font-size: clamp(18px, 2.8vw, 24px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; margin: 0; }
  .cmp-lede { font-size: 13.5px; color: var(--ink-2); margin: 8px 0 0; max-width: 70ch; line-height: 1.5; }
  .cmp-lede b { color: var(--ink); font-weight: 600; }

  .cmp-controls { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
  .cmp-field { display: flex; flex-direction: column; gap: 8px; }
  .cmp-lab { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mut); font-weight: 700; }
  .cmp-row { display: flex; gap: 6px; flex-wrap: wrap; }
  /* chips de control — caja con borde (afordancia de toggle); se rellena de --ink al activarse */
  .cmp-chip {
    font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em;
    padding: 7px 13px; border: 1px solid var(--hair); background: none; color: var(--ink-mut);
    cursor: pointer; line-height: 1; display: inline-flex; align-items: center; gap: 7px;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .cmp-chip:hover { border-color: var(--accent); color: var(--ink-2); }
  .cmp-chip.active { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .cmp-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cmp-dot { width: 9px; height: 9px; flex: none; }

  .cmp-plot-wrap { background: var(--panel); border: 1px solid var(--hair); padding: 16px 14px 10px; }
  .cmp-svg { width: 100%; height: auto; display: block; overflow: visible; }
  .cmp-svg text { font-family: var(--font-mono); }

  .cmp-summary { font-size: 13.5px; color: var(--ink); background: var(--panel-tint); border-left: 3px solid var(--accent); padding: 12px 16px; margin: 16px 0 0; line-height: 1.5; min-height: 44px; box-sizing: border-box; }
  .cmp-summary b { font-family: var(--font-mono); }
  .cmp-summary .up { color: var(--accent); } .cmp-summary .dn { color: var(--loss); }

  .cmp-notes { font-size: 11.5px; color: var(--ink-mut); margin: 16px 0 0; line-height: 1.55; }
  .cmp-notes b { color: var(--ink-2); }
  .cmp-notes a { color: var(--accent); }
  .cmp-notes .flag { color: var(--loss); font-weight: 700; }
  /* he-cash/he-loss solo colorean junto a .he-c (celda de la matriz); aquí se
     usan sueltos en el texto, así que necesitan su propia regla o quedan grises */
  .cmp-notes .he-cash { color: var(--cash); }
  .cmp-notes .he-loss { color: var(--loss); }
  .cmp-notes ul { margin: 0; padding-left: 18px; }
  .cmp-notes li { margin: 0 0 8px; }
  .cmp-notes li:last-child { margin-bottom: 0; }
  .cmp-notes li::marker { color: var(--hair); }

  /* ============ METODOLOGÍA Y FUENTES ============ */
  #view-metodologia[hidden] { display: none; }
  .meth-back {
    font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--accent);
    background: none; border: none; padding: 0; margin: 0 0 14px; cursor: pointer;
  }
  .meth-back:hover { text-decoration: underline; }
  .meth-index { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
  .meth-index button {
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em;
    padding: 6px 11px; border: 1px solid var(--hair); background: none; color: var(--ink-mut);
    cursor: pointer; line-height: 1; transition: color .15s ease, border-color .15s ease;
  }
  .meth-index button:hover { border-color: var(--accent); color: var(--ink); }
  .meth-index button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .meth-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 32px; margin-top: 22px; }
  @media (max-width: 680px) { .meth-grid { grid-template-columns: 1fr; } }
  .meth-item { border-left: 2px solid var(--hair); padding-left: 16px; transition: border-color .4s ease, background-color .4s ease; }
  /* al llegar desde una sección, su entrada se señala un momento y vuelve a la calma —
     borde + tinte de fondo, para que se note sin depender solo de un cambio de color de 2px */
  .meth-item.lit { border-left-color: var(--accent); background: var(--accent-tint); }
  .meth-h { font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: 0.02em; color: var(--accent); margin: 0 0 8px; line-height: 1.3; }
  .meth-p { font-size: 13px; line-height: 1.55; color: var(--ink-2); margin: 0 0 8px; }
  .meth-p b { color: var(--ink); font-weight: 600; }
  .meth-src { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mut); margin: 8px 0 0; line-height: 1.45; }
  .meth-src a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .meth-biblio { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--hair); }
  .meth-refs { font-size: 12.5px; line-height: 1.6; color: var(--ink-2); margin: 10px 0 0; padding-left: 22px; }
  .meth-refs li { margin-bottom: 8px; }
  .meth-refs a { color: var(--accent); word-break: break-word; }
  .meth-note { font-size: 11.5px; color: var(--ink-mut); margin: 18px 0 0; line-height: 1.55; }
  .meth-note .flag { color: var(--loss); font-weight: 700; }

  /* ---- tabla del ítem 8 (los ratios que sí sirven) — scroll horizontal, mismo
     patrón que las tablas de he-grid: en una columna de ~450px no cabe entera ---- */
  .meth-tbl-wrap { overflow-x: auto; margin: 10px 0 4px; }
  .meth-tbl { width: 100%; min-width: 480px; border-collapse: collapse; font-size: 12px; }
  .meth-tbl th, .meth-tbl td { text-align: left; padding: 7px 12px 7px 0; border-bottom: 1px solid var(--hair-soft); vertical-align: top; }
  .meth-tbl th { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-mut); font-weight: 700; white-space: nowrap; }
  .meth-tbl td { color: var(--ink-2); line-height: 1.5; }
  .meth-tbl td b { color: var(--ink); }
  .meth-tbl td.num { font-family: var(--font-mono); white-space: nowrap; color: var(--ink); }

  /* ---- formulario: todas las ecuaciones de la página, juntas ---- */
  .meth-formulario { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--hair); }
  .meth-form-grid { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; }
  .meth-form-row { display: grid; grid-template-columns: minmax(220px, 1.3fr) 1fr; gap: 8px 16px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair-soft); }
  .meth-form-eq { font-family: var(--font-mono); font-size: 12px; color: var(--ink); font-weight: 600; }
  .meth-form-use { font-size: 12px; color: var(--ink-2); line-height: 1.5; }
  @media (max-width: 680px) { .meth-form-row { grid-template-columns: 1fr; } }
  .foot-link { font-family: var(--font-mono); font-size: inherit; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; }
  .foot-link:hover { text-decoration: underline; }

  /* ============ HOJA EXCEL ============ */
  .he-block { margin-top: 26px; }
  .he-block:first-of-type { margin-top: 4px; }
  .he-block-lab {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-mut); margin: 0 0 8px;
  }
  .he-block-lab .he-mark2 { color: var(--cash); }
  .he-block-sub { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .he-block-sub.warn { color: var(--warn); }
  .he-block-sub.muted { color: var(--ink-mut); }

  .he-scroll { overflow-x: auto; padding-bottom: 2px; }
  .he-grid { display: grid; column-gap: 0; row-gap: 0; }
  /* Matriz única, 11 tracks. Las 4 opcionales (brutos, −NRA, DRIP, efectivo) viven
     siempre en el DOM y valen 0fr mientras la hoja está sin corregir. NO se
     transiciona `grid-template-columns`: medido en Chrome, la transición entre
     listas de tracks con minmax() se queda clavada en el valor inicial (las
     columnas nunca llegaban a abrirse). El track cambia de golpe — respuesta
     directa al clic — y lo que se anima es la aparición del contenido. */
  /* Las tres primeras columnas van en PÍXELES, no en fracciones: son la identidad
     de la fila (fecha, ticker, lo que pusiste) y quedan clavadas en el mismo sitio
     al encender el interruptor. El retorno, alineado a la derecha contra el borde
     de la tabla, tampoco se mueve. Lo que se reacomoda es el centro — justo donde
     entra el desglose —, que es inevitable al insertar cuatro columnas sin obligar
     a scroll horizontal. */
  /* UN SOLO template para las dos fases: las cuatro columnas del desglose ocupan
     su ancho definitivo desde el principio, vacías. Así al accionar el interruptor
     NINGUNA columna se mueve —ni las de los extremos ni las del centro— y comparar
     antes/después es leer la misma cuadrícula. El hueco no es un defecto: dice que
     a la hoja vieja le falta esa información. «− Imp. NRA» pesa más que sus vecinas
     porque lleva la cifra más ancha (signo + 7 dígitos). */
  /* 10 columnas: la primera etiqueta cuál de las dos lecturas es cada fila (la
     fecha y el ticker viven arriba, en una línea de contexto: con un solo ETF
     serían dos constantes repetidas). 850px = lo que mide el contenedor en
     escritorio, así que caben enteras sin scroll interno. */
  /* DRIP y Efectivo pesan algo más que sus vecinas: llevan la sub-línea que dice
     si entran o no en el retorno, y debe caber en un renglón. */
  .he-grid {
    min-width: 850px;
    grid-template-columns: 96px minmax(0,0.95fr) minmax(0,0.9fr) minmax(0,1.05fr) minmax(0,0.95fr) minmax(0,1.1fr) minmax(0,1.05fr) minmax(0,1fr) minmax(0,0.95fr) minmax(0,1fr);
  }
  @media (max-width: 939px) {
    .he-grid { grid-template-columns: minmax(96px,0.95fr) minmax(0,0.95fr) minmax(0,0.9fr) minmax(0,1.05fr) minmax(0,0.95fr) minmax(0,1.1fr) minmax(0,1.05fr) minmax(0,1fr) minmax(0,0.95fr) minmax(0,1fr); }
  }
  /* En pantallas estrechas la ecuación es TEXTO, no una tabla: no debería exigir
     el scroll lateral que sí necesitan las columnas. Se ancla al borde visible
     (sticky) y se ciñe al ancho de la pantalla, partiéndose en varias líneas sin
     romper los términos por dentro. Las dos cintas se igualan por medición
     (`igualarCintas` en initHoja), así el reparto distinto de líneas entre una y
     otra no mueve nada al accionar el interruptor. */

  .he-context { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mut); margin: 2px 0 10px 2px; }

  /* ---- cinta de ecuación: de dónde sale cada cifra que discrepa ----
     Ocupa todo el ancho porque la fórmula cruza columnas no contiguas
     (Valor mer. + Efectivo − Inversión); en una celda de 90px no cabría. */
  .he-eq {
    grid-column: 1 / -1; font-family: var(--font-mono); font-size: 10px; line-height: 2.1;
    color: var(--ink-mut); padding: 13px 7px 15px 22px; position: relative;
    border-bottom: 1px solid var(--hair-soft); white-space: nowrap; overflow-x: auto;
  }
  .he-eq::before {
    content: "↳"; position: absolute; left: 5px; top: 13px; color: var(--hair);
  }
  .he-eq .eq-lab { display: inline-block; min-width: 96px; color: var(--ink-mut); }
  /* el resultado ocupa un ancho fijo para que el «=» de los dos renglones caiga
     en la misma columna: las dos ecuaciones se leen como un bloque, no como
     dos frases sueltas */
  .he-eq .eq-res { display: inline-block; min-width: 66px; text-align: right; color: var(--ink); font-weight: 700; }
  .he-eq .eq-op { color: var(--ink-mut); padding: 0 7px; }
  /* cada término apunta a su columna: al pasarle el cursor, se ilumina */
  .he-eq .eq-t { color: var(--ink-2); cursor: default; border-bottom: 1px dotted transparent; }
  .he-eq .eq-t:hover { border-bottom-color: var(--accent); }
  .he-eq .eq-t.is-warn { color: var(--warn); }
  .he-eq .eq-t.is-cash { color: var(--cash); }
  .he-eq .eq-note { color: var(--ink-mut); font-style: italic; }
  .he-c.col-lit { background: var(--accent-tint); }

  @media (max-width: 700px) {
    .he-eq {
      width: calc(100vw - 2 * clamp(16px, 4vw, 40px));
      white-space: normal; padding: 12px 0 14px 16px; line-height: 1.9;
    }
    .he-eq::before { top: 12px; left: 1px; }
    /* los términos no se parten por dentro; la línea sí */
    .he-eq .eq-t, .he-eq .eq-res { white-space: nowrap; }
    .he-eq .eq-lab { min-width: 0; padding-right: 7px; white-space: nowrap; }
    .he-eq .eq-res { min-width: 0; }
    .he-eq .eq-op { padding: 0 5px; }
  }
  .he-row-lab { font-family: var(--font-sans); font-weight: 700; font-size: 12px; color: var(--ink-2); }

  /* La segunda lectura aparece bajo la primera, sin cabecera repetida, así los
     números a comparar quedan a una fila de distancia en la misma columna. Su
     espacio está RESERVADO desde el principio (`visibility`, no `display`): al
     accionar el interruptor no se empuja nada de lo que viene debajo. */
  .he-b { visibility: hidden; }
  .he-grid.honest .he-b { visibility: visible; }
  .he-grid.honest .he-c.he-b { animation: fadeIn .3s ease both; }
  /* Con la corregida a la vista, la de arriba pasa a ser la referencia histórica.
     La jerarquía se hace quitando peso a la vieja, no añadiendo adornos a la
     buena: un velo uniforme conserva los colores semánticos (el ámbar del total
     inflado, el rojo del retorno) para que se puedan seguir comparando. */
  .he-grid.honest .he-row-lab:not(.he-b) { color: var(--ink-mut); }
  .he-grid.honest .he-c:not(.he-b),
  .he-grid.honest .he-eq:not(.he-b) { opacity: .68; }
  /* al señalar un término de su propia ecuación, la lectura vieja recupera nitidez */
  .he-grid.honest .he-eq:not(.he-b):hover { opacity: 1; }

  /* padding lateral ajustado (7px): con once columnas es lo que permite que la
     cifra más ancha, −$105.08, no se recorte dentro del ancho del contenedor. */
  .he-h, .he-c { padding: 8px 7px; text-align: right; overflow: hidden; box-sizing: border-box; }
  .he-h.he-l, .he-c.he-l { text-align: left; }
  .he-c { white-space: nowrap; }
  /* Los encabezados se apoyan en la regla inferior (align-items:flex-end): el
     alto reservado —para que al abrir columnas los rótulos de 2 líneas no muevan
     la tabla— queda como aire ARRIBA, no como un hueco entre rótulo y regla. */
  .he-h {
    font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-mut); border-bottom: 2px solid var(--anchor);
    padding-bottom: 12px; line-height: 1.35; white-space: nowrap; align-self: stretch;
    display: flex; align-items: flex-end; justify-content: flex-end; min-height: 42px;
  }
  .he-h.he-l { justify-content: flex-start; }
  .he-lab {
    cursor: help; border-bottom: 1px dotted var(--hair); padding-bottom: 1px;
    transition: color .15s ease, border-color .15s ease;
  }
  .he-lab:hover { border-bottom-color: var(--accent); color: var(--accent); }
  /* Inversión y Valor mer. son las dos columnas que la hoja compara entre sí. El
     recuadro punteado las marca como par — van salteadas (4ª y 7ª), así que el
     recuadro + la línea que las une es lo único que las agrupa. El color del
     rótulo NO se toca: el morado en el texto competía con los datos. */
  .he-h.he-mark .he-lab { border: 1px dashed var(--mark); padding: 3px 6px; }

  /* Puente entre los dos recuadros. La fila abarca la tabla entera y el tramo
     visible se posiciona con JS (placeBridge) midiendo el borde derecho de la
     caja de Inversión y el izquierdo de la de Valor mer. — los recuadros van
     alineados a la derecha dentro de su celda, así que ningún grid-column los
     alcanza; hay que medirlos. */
  .he-bridge { grid-column: 1 / 9; align-self: end; position: relative; height: 22px; }
  .he-bridge-hit {
    position: absolute; top: 0; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: none; border: none; padding: 0; font: inherit;
  }
  .he-bridge-hit::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    border-top: 1px dashed var(--mark);
  }
  .he-bridge-lab {
    position: relative; z-index: 1; background: var(--ground); padding: 0 8px;
    font-family: var(--font-mono); font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--mark);
    white-space: nowrap; transition: opacity .15s ease;
  }
  .he-bridge-lab::after { content: " ⓘ"; }
  .he-bridge-hit:hover .he-bridge-lab { opacity: .7; }
  .he-bridge-hit:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  @media (max-width: 700px) { .he-bridge-lab { font-size: 8px; padding: 0 5px; } }

  /* Cada lectura son dos bandas: sus cifras y su ecuación. La línea va al final de
     la ecuación, no entre ambas, porque pertenecen a la misma lectura. */
  .he-c { font-size: 12.5px; font-weight: 700; color: var(--ink); padding-top: 13px; padding-bottom: 5px; }
  .he-eq { border-bottom: 2px solid var(--anchor); }
  .he-grid.honest .he-eq:not(.he-b) { border-bottom: 1px solid var(--hair-soft); }
  /* La lectura reservada lleva 1px mientras está oculta y 2px cuando cierra la
     tabla: la suma de bordes —y el alto total— es la misma en las dos fases. */
  .he-eq.he-b { border-bottom-width: 1px; }
  .he-grid.honest .he-eq.he-b { border-bottom-width: 2px; }
  .he-c.he-mono { font-family: var(--font-mono); font-weight: 400; color: var(--ink-mut); }
  .he-c.he-tk { font-family: var(--font-sans); font-weight: 800; color: var(--ink); }
  .he-c.he-muted { color: var(--ink-mut); font-weight: 600; }
  .he-c.he-nra { color: var(--loss); }
  .he-c.he-cash { color: var(--cash); }
  .he-c.he-loss { color: var(--loss); }

  /* La advertencia la lleva el color, no una caja: con once columnas, un bloque
     de fondo pesa más que la cifra que señala. */
  .he-h.he-warn, .he-c.he-warn { color: var(--warn); }
  .he-h.he-nra { color: var(--loss); }
  .he-h.he-cash { color: var(--cash); }

  /* ---- estado corregido: la hoja deja de mentir a la vista ---- */
  /* «Total inv.» conserva su franja para marcar la columna, pero el ⚠ y el ámbar
     son de la lectura vieja: en la fila corregida esa cifra ya es correcta. */
  .he-grid.honest .he-c.he-warn { color: var(--ink-mut); }
  .he-grid.honest .he-h.he-warn { color: var(--ink-mut); }
  /* La franja de advertencia es de la CIFRA inflada, no de la columna entera: en
     la lectura corregida ese total ya es correcto, así que no la lleva. */
  .he-grid.honest .he-c.he-warn.he-b { color: var(--ink); background: none; }
  /* Las sub-líneas de DRIP y Efectivo ocupan el segundo renglón que la fila YA
     tiene por el `%` del retorno, así que encender el interruptor no mueve nada
     verticalmente. Deben caber en UNA línea: si envuelven, la fila crece y empuja
     todo lo de abajo (medido, no estimado). */

  /* Las columnas del desglose ocupan su sitio desde el principio: en la fila «Tu
     hoja» llevan un guion, porque esa información la hoja vieja no la tiene. Sus
     rótulos van atenuados mientras no hay con qué llenarlas. */
  .he-opt .he-lab { opacity: .45; }
  .he-grid.honest .he-opt .he-lab { opacity: 1; }
  .he-ph { color: var(--hair); font-weight: 400; }

  .he-sub { display: block; font-size: 9px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink-mut); margin-top: 1px; white-space: normal; }
  .he-sub.cash { color: var(--cash); }

     entre modos es la leyenda (#tmModoCap) y la nota de la matriz 3; ambas se
     miden en vivo (ajustarBaseFiscal en initMetodo), no se estiman. */

  /* ============ MÉTODO TRADICIONAL: la hoja de la clase auditada ============ */
  /* Reutiliza el vocabulario de HOJA EXCEL (.he-grid/.he-c/.he-h/.he-lab/.he-eq/
     .he-switch) y de COMPARACIÓN (.cmp-head/.cmp-title/.cmp-lede/.cmp-summary/

     el grid de 8 columnas de la matriz, el de 5 de la prueba DRIP, el de 4 del
     payback y el de 5 de tasa-vs-yield; la fila-escalón del rendimiento; y las
     calculadoras vivas de las fallas 1 y 6. */
  /* Todas en `fr`: las tablas LLENAN el ancho del contenedor en vez de encogerse
     a la izquierda. El min-width es el piso por debajo del cual sí conviene hacer
     scroll (móvil), no el ancho de trabajo — en escritorio siempre sobra sitio y
     las columnas se reparten el espacio. */
  .tm-grid { min-width: 680px; grid-template-columns: 64px 88px minmax(0,0.85fr) minmax(0,1.05fr) minmax(0,1.1fr) minmax(0,1.05fr) minmax(0,1fr) minmax(0,0.95fr); }
  .tm-grid2 { min-width: 320px; grid-template-columns: 64px minmax(0,0.85fr) minmax(0,0.65fr); }
  .tm-grid3 { min-width: 460px; grid-template-columns: 72px minmax(0,1fr) minmax(0,1.15fr) minmax(0,1.3fr); }
  /* matrices 2 y 3: el mismo dinero contado por sus dos destinos posibles.
     Mismas proporciones en las columnas que comparten, para que se lean como un
     par y las cifras equivalentes caigan alineadas entre una tabla y la otra. */
  /* tm-grid6 ahora sirve a "Sin DRIP" (creció de 5 a 6 columnas al sumar
     Devuelto) — mismas proporciones, no hacía falta tocarlas: Devuelto es
     tan angosto como el resto. tm-grid7 es "Con DRIP" (de 6 a 7), extensión
     directa del mismo patrón con una columna más antes de Total. */
  .tm-grid6 { min-width: 560px; grid-template-columns: 72px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr); }

  .tm-grid4 { min-width: 520px; grid-template-columns: 64px minmax(0,1fr) minmax(0,0.9fr) minmax(0,0.85fr) minmax(0,1.15fr); }

  /* Solo en pantallas angostas se aprieta la familia "Método tradicional":
     tipografía y padding menores, encabezados que envuelven (min-height reserva
     el alto) y columnas en px medidas para que la tabla entre sin scroll. En
     escritorio nada de esto aplica y las tablas respiran. */
  @media (max-width: 700px) {
    /* letter-spacing casi a cero: es lo que permite que «DIVIDENDOS» e
       «INVERSIÓN» quepan ENTERAS en su columna. Con el espaciado normal se
       partían a mitad de palabra, que es lo que se veía apeñuscado. */
    .he-grid[class*="tm-grid"] .he-h {

       reparte el sobrante para que la tabla llene el ancho en vez de dejar un
       hueco a la derecha — y de paso «DIVIDENDOS» cabe entero en su renglón. */
    .tm-grid6 { min-width: 342px; grid-template-columns: 46px minmax(76px,1.25fr) minmax(54px,1fr) minmax(54px,1fr) minmax(55px,1fr) minmax(57px,1fr); }

    .tm-grid4 { min-width: 360px; grid-template-columns: 48px minmax(0,1fr) minmax(0,0.9fr) minmax(0,0.85fr) minmax(0,1.15fr); }
  }
  /* Teléfonos: un punto menos en las cifras compra el ancho que falta para que
     también aquí entren sin scroll. El corte va en 460px —no en 400— desde que

  @media (max-width: 460px) {

          <div class="io-track"><div class="io-fill" id="ioOutFill" style="width:62.65%"></div><div class="io-ghost" id="ioOutGhostWrap" style="padding-left:10px"><span class="num" id="ioOutGhost" style="margin-left:0">$605.43</span></div></div>
        </div>
      </div>
    </div>

    <!-- Explicación única del paso -->
    <p class="step-note" id="stepNote"></p>

    <!-- WATERFALL -->
    <div class="fall-scroll">
      <div class="fall" id="fall"></div>
    </div>
  </section>

  <!-- ============ CIERRE: el remate, scroll deliberado ============ -->
  <div class="closer-divider" aria-hidden="true"></div>

  <!-- WAFFLE -->
  <section class="sec closer">
    <p class="eyebrow">Tu dinero en cuadritos</p>
    <div class="waffle-wrap">
      <div class="grid" id="grid" role="img" aria-label="Mosaico de 100 cuadritos"></div>
      <div>
        <div class="legend" id="legend"></div>
        <div class="surv" id="surv"></div>
        <p class="waffle-note">Cada cuadrito ≈ <span class="num">$9.66</span> de tu pico (<span class="num">$966.48</span>, la mayor suma de categorías del recorrido).</p>
      </div>
    </div>
  </section>
  </div><!-- /panel-viaje -->
</main>
<div id="tip" role="status"></div>
<script>
(function () {
  "use strict";
  "use strict";

  // ---------- constants (Schwab caso 2 · MSTY) ----------
  var D = {{DATA_JSON}};
  var POCKET = D.POCKET, BRUTO = D.BRUTO, IMPUESTO = D.IMPUESTO, NETO = D.NETO, DRIP = D.DRIP, CASH = D.CASH, TOTAL_TRABAJANDO = D.TOTAL_TRABAJANDO, MERCADO = D.MERCADO, VALOR_HOY = D.VALOR_HOY, CAPITAL_ACTUAL = D.CAPITAL_ACTUAL, RESULTADO = D.RESULTADO, PICO = D.PICO;

  // 8 pasos (Salud NAV es ahora su propia sección, no un paso). Etiquetas
  // abreviadas para columnas de ancho igual — el nombre completo va en la caption.
  var STEP_LABELS = ["Bolsillo","Div. bruto","Imp. NRA","Reinv + Efvo",
                      "Bols + DRIP","Mercado","Cap. actual","Resultado"];

  var PLOT_H = 300, MAXV = PICO, sc = PLOT_H / MAXV;
  var pasoActual = {{PASO}}; // arranca en el estado final ya aprobado; se puede retroceder

  // ---------- tooltip ----------
  var tip = document.getElementById("tip");
  function showTip(html, x, y) {
    tip.innerHTML = html; tip.classList.add("on");
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = x + 14, top = y - h - 12;
    if (left + w > window.innerWidth - 8) left = x - w - 14;
    if (top < 8) top = y + 18;
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }
  function hideTip() { tip.classList.remove("on"); }
  function tipHtml(c) {
    return '<div class="t-h">' + c.th + '</div><div class="t-v">' + c.tv + '</div>' +
           '<div style="margin-top:4px;opacity:.85">' + c.td + '</div>';
  }

  // ---------- verdict card (portada) ----------
  var STEP_VALUES = [POCKET, PICO, PICO - IMPUESTO, TOTAL_TRABAJANDO, TOTAL_TRABAJANDO, VALOR_HOY, CAPITAL_ACTUAL];
  var VERDICT_KICKERS = ["Tu punto de partida", "Dividendo bruto acumulado", "Después del impuesto NRA",
                          "Capital listo para trabajar", "Capital expuesto al mercado",
                          "Después del impacto del mercado", "Capital actual total"];

  var vKick = document.getElementById("vKick"), vBig = document.getElementById("vBig"),
      vPct = document.getElementById("vPct"),
      ioOutLab = document.getElementById("ioOutLab"), ioOutFill = document.getElementById("ioOutFill"),
      ioOutGhost = document.getElementById("ioOutGhost"), ioOutGhostWrap = document.getElementById("ioOutGhostWrap"),
      verdictCard = document.getElementById("verdictCard");

  // El label del monto nunca debe quedar a caballo entre el relleno y el track vacío:
  // si hay espacio, vive DENTRO del relleno (texto claro); si no, justo DESPUÉS de su borde (texto mudo).
  function placeGhost(ratio) {
    var inside = ratio >= 0.55;
    ioOutGhostWrap.style.paddingLeft = inside ? "10px" : (Math.min(ratio, 0.9) * 100).toFixed(2) + "%";
    ioOutGhost.style.color = inside ? "var(--panel)" : "var(--ink-mut)";
    ioOutGhost.style.marginLeft = inside ? "0" : "8px";
  }

  function updateVerdict(step) {
    var isFinal = step === 7;
    var val = isFinal ? CAPITAL_ACTUAL : STEP_VALUES[step];
    var pct = (val / POCKET - 1) * 100;
    var deltaUsd = val - POCKET;
    var state = (!isFinal && step === 0) ? "base" : (deltaUsd >= 0 ? "up" : "loss");
    var colorVar = state === "up" ? "var(--accent)" : state === "loss" ? "var(--loss)" : "var(--ink-mut)";
    var fillRatio = val / MAXV;

    vKick.textContent = isFinal ? "Tu resultado real" : VERDICT_KICKERS[step];
    vBig.textContent = isFinal
      ? ((deltaUsd >= 0 ? "+" : "−") + "$" + Math.abs(deltaUsd).toFixed(2))
      : ("$" + val.toFixed(2));
    vBig.className = "v-big num" + (state === "base" ? "" : " " + state);
    vPct.innerHTML = '<span class="v-pct-lab">Rendimiento</span> <span class="num">' +
                      (pct >= 0 ? "+" : "−") + Math.abs(pct).toFixed(1) + "%</span>" +
                      ' <span class="v-pct-sep">·</span> <span class="num">' +
                      (deltaUsd >= 0 ? "+" : "−") + "$" + Math.abs(deltaUsd).toFixed(2) + "</span>";
    vPct.className = "v-pct" + (state === "base" ? "" : " " + state);
    ioOutLab.textContent = isFinal ? "Tienes hoy" : "Ahora";
    ioOutFill.style.width = (fillRatio * 100).toFixed(2) + "%";
    ioOutFill.style.background = colorVar;
    ioOutGhost.textContent = "$" + val.toFixed(2);
    placeGhost(fillRatio);
    verdictCard.style.borderLeftColor = colorVar;
  }

  // ---------- columns (un solo carril de 8, 1:1 con los pasos) ----------
  var resultadoAmt = (RESULTADO >= 0 ? "+$" : "−$") + Math.abs(RESULTADO).toFixed(2);
  var resultadoCap = RESULTADO >= 0 ? "up" : "dn";
  var COLS = [
    { segs:[{cls:"s-anchor", lo:0, hi:POCKET}],
      amt:"$" + POCKET.toFixed(2), cap:"base", lab:"Tu bolsillo", run:POCKET,
      th:"Tu bolsillo", tv:"+$" + POCKET.toFixed(2),
      td:"Lo que pusiste de tu propio dinero. Es tu costo — la vara con la que se mide todo el recorrido." },
    { segs:[{cls:"s-transito", lo:POCKET, hi:PICO}],
      amt:"+$" + BRUTO.toFixed(2), cap:"up", lab:"Dividendo bruto", run:PICO,
      th:"Dividendo bruto", tv:"+$" + BRUTO.toFixed(2),
      td:"Lo que el fondo repartió antes de impuestos. Este es tu pico de capital: $" + PICO.toFixed(2) + "." },
    { segs:[{cls:"s-loss", lo:TOTAL_TRABAJANDO + CASH, hi:PICO}],
      amt:"−$" + IMPUESTO.toFixed(2), cap:"dn", lab:"Impuesto NRA", run:PICO - IMPUESTO,
      th:"Impuesto NRA", tv:"−$" + IMPUESTO.toFixed(2),
      td:"Retención automática de EE.UU. sobre dividendos a extranjeros. Sale del sistema — no vuelve." },
    { segs:[{cls:"s-cash", lo:TOTAL_TRABAJANDO, hi:TOTAL_TRABAJANDO + CASH}],
      amt:"−$" + CASH.toFixed(2), cap:"cashc", lab:"Efectivo apartado", run:TOTAL_TRABAJANDO,
      th:"Efectivo apartado", tv:"−$" + CASH.toFixed(2),
      td:"La parte del dividendo neto que NO reinviertes. No se pierde — se aparta, a salvo, del mercado." },
    { segs:[{cls:"s-anchor", lo:0, hi:POCKET}, {cls:"s-drip", lo:POCKET, hi:TOTAL_TRABAJANDO}],
      amt:"$" + TOTAL_TRABAJANDO.toFixed(2), cap:"base", lab:"Capital trabajando", sub:"= Bolsillo + DRIP", run:null,
      th:"Capital trabajando", tv:"$" + TOTAL_TRABAJANDO.toFixed(2),
      td:"Tu bolsillo ($" + POCKET.toFixed(2) + ") + lo reinvertido ($" + DRIP.toFixed(2) + "). Esto es lo que queda expuesto al mercado." },
    { segs:[{cls:"s-loss", lo:VALOR_HOY, hi:TOTAL_TRABAJANDO}],
      amt:"−$" + Math.abs(MERCADO).toFixed(2), cap:"dn", lab:"Impacto del mercado", run:VALOR_HOY,
      th:"Impacto del mercado", tv:"−$" + Math.abs(MERCADO).toFixed(2),
      td:"La caída del precio del fondo. Tu capital de trabajo pasa de $" + TOTAL_TRABAJANDO.toFixed(2) + " a $" + VALOR_HOY.toFixed(2) + "." },
    { segs:[{cls:"s-cash", lo:VALOR_HOY, hi:CAPITAL_ACTUAL}],
      amt:"+$" + CASH.toFixed(2), cap:"cashc", lab:"Efectivo cobrado", run:CAPITAL_ACTUAL,
      th:"Efectivo cobrado", tv:"+$" + CASH.toFixed(2),
      td:"El mismo efectivo que apartaste en el paso 4 vuelve a sumar. Total: $" + CAPITAL_ACTUAL.toFixed(2) + "." },
    { segs:[{cls:"s-anchor", lo:0, hi:VALOR_HOY}, {cls:"s-cash", lo:VALOR_HOY, hi:CAPITAL_ACTUAL}],
      amt:resultadoAmt, cap:resultadoCap, lab:"Resultado real", sub:"vs. tu bolsillo", run:null,
      th:"Resultado real", tv:resultadoAmt,
      td:"Lo que tienes hoy ($" + CAPITAL_ACTUAL.toFixed(2) + ") frente a lo que pusiste ($" + POCKET.toFixed(2) + "). La diferencia es lo que el mercado se llevó." }
  ];
  function colsForStep(step) { return COLS.slice(0, step + 1); }
  var SLOT_COUNT = 8;
  function newColIndex(step) { return step; }   // 1:1 rail ↔ columna

  // ---------- render waterfall ----------
  // Un solo carril de 8 slots reservados, 1:1 con los 8 pasos del rail. Las
  // columnas se llenan de izquierda a derecha; nunca se borran, nunca cambian
  // de ancho ni de posición entre pasos — el número de slots es fijo (8) desde
  // el primer render. Los slots futuros quedan reservados mostrando en fantasma
  // el nombre del paso que viene (STEP_LABELS). Solo la columna NUEVA se anima;
  // las anteriores quedan "settled" (quietas).

  var fall = document.getElementById("fall");
  function render(step) {
    pasoActual = step;
    updateRailStates();
    updateVerdict(step);

    var cols = colsForStep(step);
    var newIdx = newColIndex(step);
    var lastRealIdx = cols.length - 1;

    fall.innerHTML = "";
    var plot = document.createElement("div");
    plot.className = "plot";

    var slots = [];
    var maxSlots = SLOT_COUNT;
    for (var i = 0; i < maxSlots; i++) slots.push(cols[i] || null);

    slots.forEach(function (c, ci) {
      var col = document.createElement("div");
      col.className = "col" + (c ? "" : " reserved");
      if (!c) {
        col.innerHTML = '<div class="slot-tick"></div><div class="slot-ghost">' + STEP_LABELS[ci] + '</div>';
        plot.appendChild(col); return;
      }

      var animate = (ci === newIdx);
      c.segs.forEach(function (seg) {
        var lo = Math.min(seg.lo, seg.hi), hi = Math.max(seg.lo, seg.hi);
        var el = document.createElement("div");
        el.className = "seg " + seg.cls + (animate ? "" : " settled");
        el.style.bottom = (lo * sc) + "px";
        el.style.height = ((hi - lo) * sc) + "px";
        el.style.cursor = "pointer";
        function move(e) {
          var pt = e.touches ? e.touches[0] : e;
          showTip(tipHtml(c), pt.clientX, pt.clientY);
        }
        el.addEventListener("mouseenter", move);
        el.addEventListener("mousemove", move);
        el.addEventListener("mouseleave", hideTip);
        col.appendChild(el);
      });

      var cap = document.createElement("div");
      cap.className = "col-cap";
      var runHtml = c.run != null ? '<div class="cap-run num">$' + c.run.toFixed(2) + "</div>" : "";
      var subHtml = c.sub ? '<div class="cap-sub">' + c.sub + "</div>" : "";
      cap.innerHTML = '<div class="cap-amt ' + c.cap + ' num">' + c.amt + '</div>' +
                      '<div class="cap-lab">' + c.lab + "</div>" + subHtml + runHtml;
      col.appendChild(cap);

      if (step === 7 && ci === 7) {
        var gap = document.createElement("div");
        gap.className = "gap-band";
        gap.style.bottom = (CAPITAL_ACTUAL * sc) + "px";
        gap.style.height = ((POCKET - CAPITAL_ACTUAL) * sc) + "px";
        gap.innerHTML = "<span>−$" + Math.abs(RESULTADO).toFixed(2) + "</span>";
        col.appendChild(gap);
      }

      plot.appendChild(col);
    });

    if (step === 7) {
      var cl = document.createElement("div");
      cl.className = "costline";
      cl.style.bottom = (POCKET * sc) + "px";
      cl.innerHTML = '<span class="cl-lab">Lo que pusiste<br>$' + POCKET.toFixed(2) + "</span>";
      plot.appendChild(cl);
    }

    fall.appendChild(plot);

    if (step === 7) {
      document.getElementById("stepNote").innerHTML =
        "<b>Resultado real</b> · La franja rayada mide el hueco entre lo que pusiste " +
        "(la línea roja) y lo que te queda hoy: eso es lo que el mercado se llevó.";
    } else {
      var last = cols[lastRealIdx];
      document.getElementById("stepNote").innerHTML = "<b>" + last.th + "</b> · " + last.td;
    }

    renderWaffle(step);
  }

  // ---------- rail ----------
  var railEl = document.getElementById("rail");
  STEP_LABELS.forEach(function (s, i) {
    var el = document.createElement("div");
    el.className = "step clickable";
    el.setAttribute("role", "button");
    el.setAttribute("tabindex", "0");
    el.innerHTML = '<div class="step-bar"></div><div class="step-lab">' + s + "</div>";
    el.addEventListener("click", function () { render(i); });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); render(i); }
    });
    railEl.appendChild(el);
  });
  function updateRailStates() {
    var steps = railEl.querySelectorAll(".step");
    steps.forEach(function (el, i) {
      el.classList.remove("done", "now");
      if (i < pasoActual) el.classList.add("done");
      else if (i === pasoActual) el.classList.add("now");
    });
  }

  // ---------- waffle: 100 cuadritos = % del pico, progresivo por paso ----------
  // Port fiel de _build_clusters (app_old.py) — mismo cálculo, mismo redondeo por
  // categoría. Verificado: el estado final da 10/53/3/20/4/10, idéntico al
  // mosaico fijo que reemplaza.
  var MOSAIC_UNIT = PICO / 100;
  function nb(x) { return Math.max(0, Math.round(x / MOSAIC_UNIT)); }
  var N_PK = nb(POCKET), N_BR = nb(BRUTO), N_IM = nb(IMPUESTO), N_DR = nb(DRIP), N_CA = nb(CASH), N_MV = nb(VALOR_HOY);

  // Cada segmento carga su monto REAL (amt) además del conteo de cuadritos (n).
  // La leyenda usa amt, nunca n*unit — n*unit es una aproximación visual (el
  // redondeo por categoría no cierra exacto a los centavos) y mostrarla como
  // si fuera el monto real desalinea la cifra (ej. $608.88 en vez de $605.43).
  function segsForStep(step) {
    if (step === 0) {
      return [{ n: N_PK, amt: POCKET, cls: "q-anchor", cat: "Tu bolsillo", note: "Tu capital, recién puesto — todavía no expuesto a nada." }];
    }
    if (step === 1) {
      return [
        { n: N_PK, amt: POCKET, cls: "q-anchor", cat: "Tu bolsillo", note: "Tu capital aportado." },
        { n: N_BR, amt: BRUTO, cls: "q-transito", cat: "Dividendo bruto", note: "Repartido, pero aún sin clasificar entre impuesto, DRIP y efectivo." }
      ];
    }
    if (step === 2) {
      var nTransito = Math.max(0, N_BR - N_IM);
      return [
        { n: N_PK, amt: POCKET, cls: "q-anchor", cat: "Tu bolsillo", note: "Tu capital aportado." },
        { n: N_IM, amt: IMPUESTO, cls: "q-sd", cat: "Impuesto NRA", note: "Retenido automáticamente. Sale del sistema — no vuelve." },
        { n: nTransito, amt: BRUTO - IMPUESTO, cls: "q-transito", cat: "Dividendo bruto", note: "Lo que queda del bruto, aún sin repartir entre DRIP y efectivo." }
      ];
    }
    if (step >= 3 && step <= 6) {
      return [
        { n: N_PK, amt: POCKET, cls: "q-anchor", cat: "Tu bolsillo", note: "Tu capital aportado — expuesto al mercado junto con el DRIP." },
        { n: N_DR, amt: DRIP, cls: "q-drip", cat: "DRIP", note: "Dividendos reinvertidos — la misma suerte que tu bolsillo." },
        { n: N_CA, amt: CASH, cls: "q-cash", cat: "Efectivo", note: "Ya cobrado, a salvo del mercado." }
      ];
    }
    // step 7 — se revela qué sobrevivió. El monto real de cada categoría (POCKET,
    // DRIP) se le asigna SOLO a la pieza "vivo" — la pieza "destruido" lleva
    // amt:0 — así al sumar ambas piezas en la leyenda el total no se duplica.
    var nCapital = N_PK + N_DR, pkAlive, drAlive, nExtra = 0;
    if (N_MV >= nCapital) {
      pkAlive = N_PK; drAlive = N_DR; nExtra = N_MV - nCapital;
    } else {
      var frac = nCapital > 0 ? N_MV / nCapital : 0;
      pkAlive = Math.round(N_PK * frac);
      drAlive = Math.round(N_DR * frac);
    }
    var pkDead = N_PK - pkAlive, drDead = N_DR - drAlive;
    var out = [
      { n: pkAlive, amt: POCKET, cls: "q-anchor", cat: "Tu bolsillo — vivo", note: "Capital tuyo que sobrevivió." },
      { n: pkDead, amt: 0, cls: "q-sd", cat: "Tu bolsillo — destruido", note: "Capital tuyo que el mercado borró." },
      { n: drAlive, amt: DRIP, cls: "q-drip", cat: "DRIP — vivo", note: "Dividendo reinvertido que sobrevivió." },
      { n: drDead, amt: 0, cls: "q-sl", cat: "DRIP — destruido", note: "Dividendo reinvertido, borrado." }
    ];
    if (nExtra > 0) out.push({ n: nExtra, amt: 0, cls: "q-cash", cat: "Apreciación", note: "Ganancia por encima de tu capital + DRIP." });
    if (N_CA > 0) out.push({ n: N_CA, amt: CASH, cls: "q-cash", cat: "Efectivo", note: "Dividendos ya cobrados, a salvo." });
    return out;
  }

  var SWATCH = {
    "q-anchor":   '<i class="sw-anchor"></i>',
    "q-transito": '<i class="sw-anchor" style="background:var(--accent-tint);border:1px solid var(--accent);"></i>',
    "q-sd":       '<i class="sw-anchor" style="background:var(--loss-bg);border:1px solid var(--loss-soft);"></i>',
    "q-drip":     '<i class="sw-drip"></i>',
    "q-cash":     '<i class="sw-cash"></i>'
  };
  var SWATCH_SPLIT = { "Tu bolsillo": '<i class="sw-anchor"></i><i class="sw-struck"></i>', "DRIP": '<i class="sw-drip"></i><i class="sw-struck"></i>' };

  // Agrupa "X — vivo" + "X — destruido" (misma fuente) en 1 fila. La nota
  // NUNCA se queda solo con la mitad de la historia: si hay split, dice
  // cuántos viven y cuántos se destruyeron, en vez de heredar la nota del
  // primer segmento (bug real: se perdía la mención del destruido). El
  // swatch doble (vivo+tachado) SOLO aplica cuando de verdad hay split —
  // en los pasos 0-6 el bolsillo usa su swatch simple, no tachado.
  function legendHtml(segs) {
    var byCat = {}, order = [];
    segs.forEach(function (s) {
      var isAlive = / — vivo$/.test(s.cat), isDead = / — destruido$/.test(s.cat);
      var key = s.cat.replace(/ — (vivo|destruido)$/, "");
      if (!byCat[key]) { byCat[key] = { n: 0, amt: 0, note: s.note, cls: s.cls, alive: null, dead: null }; order.push(key); }
      byCat[key].n += s.n;
      byCat[key].amt += s.amt;
      if (isAlive) byCat[key].alive = s.n;
      if (isDead) byCat[key].dead = s.n;
    });
    return order.map(function (key) {
      var g = byCat[key];
      var hasSplit = g.alive != null && g.dead != null;
      var note = g.note;
      if (hasSplit) {
        note = g.dead > 0
          ? (g.alive + (g.alive === 1 ? ' cuadrito vivo' : ' cuadritos vivos') + ' · ' + g.dead + ' destruidos')
          : 'Los ' + g.alive + ' siguen vivos.';
      }
      var sw = hasSplit ? (SWATCH_SPLIT[key] || SWATCH["q-anchor"]) : SWATCH[g.cls];
      var amt = "$" + g.amt.toFixed(2);
      return '<div class="leg-row"><span class="leg-sw">' + sw + '</span>' +
             '<span class="leg-txt"><strong>' + key + ' · <span class="leg-amt">' + amt + '</span></strong>' +
             '<small>' + note + '</small></span></div>';
    }).join("");
  }

  var grid = document.getElementById("grid");
  function renderWaffle(step) {
    var segs = segsForStep(step);
    var lit = segs.reduce(function (a, s) { return a + s.n; }, 0);
    var off = Math.max(0, 100 - lit);

    grid.innerHTML = "";
    var idx = 0;
    segs.concat(off > 0 ? [{ n: off, cls: "q-off", cat: "Sin usar", note: "Espacio hasta tu pico de capital." }] : [])
      .forEach(function (s) {
        for (var k = 0; k < s.n; k++) {
          var sq = document.createElement("div");
          sq.className = "sq " + s.cls;
          sq.style.animationDelay = (idx * 6) + "ms";
          (function (seg) {
            function m(e) {
              var pt = e.touches ? e.touches[0] : e;
              showTip('<div class="t-h">' + seg.cat + '</div><div style="opacity:.85">' + seg.note + '</div><div class="t-v" style="margin-top:3px">≈ $' + MOSAIC_UNIT.toFixed(2) + '</div>', pt.clientX, pt.clientY);
            }
            sq.addEventListener("mouseenter", m);
            sq.addEventListener("mousemove", m);
            sq.addEventListener("mouseleave", hideTip);
          })(s);
          grid.appendChild(sq);
          idx++;
        }
      });
    grid.setAttribute("aria-label", "Mosaico de 100 cuadritos, paso " + (step + 1) + " de 9");

    document.getElementById("legend").innerHTML = legendHtml(segs);

    var surv = document.getElementById("surv");
    if (step === 7) {
      var pctAlive = Math.round(((segs[0].n + segs[2].n) / (N_PK + N_DR)) * 100);
      var pctDead = 100 - pctAlive;
      surv.innerHTML = 'De cada $100 invertidos, <b class="alive">' + pctAlive +
                        ' siguen vivos</b> y <b class="dead">' + pctDead +
                        ' se destruyeron</b> · <b>+' + N_CA + '</b> ya en efectivo.';
    } else {
      surv.innerHTML = 'Todavía no sabemos cuánto sobrevive — eso se revela en el <b>paso 8</b>, cuando se conoce el impacto del mercado.';
    }
  }

  render(pasoActual);
  render(pasoActual);
})();
</script>
<script>
/* Auto-alto del iframe. `components.html` fija el alto desde Python y no se adapta al
   contenido, así que cada componente reservaba cientos de píxeles de vacío. El iframe es
   same-origin (`srcdoc`), así que desde aquí se alcanza el propio <iframe> del documento
   padre y se le corrige el alto. NO se usa `streamlit:setFrameHeight`: ese canal es de
   componentes registrados con `declare_component`, no de `components.html`.
   Se mide `body.scrollHeight` y NO `documentElement.scrollHeight`: el segundo nunca baja
   del alto del viewport del iframe, así que nunca detectaría el vacío. */
(function () {
  "use strict";
  var fe = null;
  try { fe = window.frameElement; } catch (e) { fe = null; }
  if (!fe) return;   // cross-origin o abierto suelto: se queda el alto que fijó Python
  var aplicado = 0;
  function ajustar() {
    var h = Math.ceil(document.body.scrollHeight);
    if (!h || Math.abs(h - aplicado) <= 1) return;
    aplicado = h;
    fe.setAttribute("height", String(h));
    fe.style.height = h + "px";
  }
  window.__vdAjustarAlto = ajustar;
  ajustar();
  [60, 200, 500, 1200].forEach(function (ms) { setTimeout(ajustar, ms); });
  window.addEventListener("resize", ajustar);
  if (window.ResizeObserver) {
    /* Referencia fuerte a propósito: un ResizeObserver sin referencia puede recolectarse
       y dejar de avisar en silencio. */
    var ro = new ResizeObserver(ajustar);
    ro.observe(document.body);
    window.__vdAltoRO = ro;
  }
  /* Red de seguridad: ni el panel de navegador embebido ni Chrome headless disparan
     ResizeObserver ni `resize`. Los temporizadores sí corren en todos esos entornos. */
  setInterval(ajustar, 1000);
})();
</script>
