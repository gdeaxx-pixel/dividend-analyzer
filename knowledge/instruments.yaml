  note: "Caso de libro de 'yield alto ≠ ganancia'. Evalúa MSTY por Retorno Total (precio hoy + dividendos cobrados − inversión), nunca solo por el yield. Ojo: la distribución es semanal; al comparar 'yield' anualiza 52 pagos, no 12."

